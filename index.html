<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Døgn</title>
<meta name="theme-color" content="#1B2127">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Døgn">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Døgn – mørkt, terminalaktig uttrykk. Bevisst bare ett (mørkt) tema. */
:root{
  --ground:#151A1F; --bar:#1B2127; --panel:#1F262D; --panel-hi:#252E36; --field:#13181C;
  --night:#1B2533; --night-line:#314560; --night-bar:#5479A0;
  --line:#37434D; --line-soft:#2C363F;
  --ink:#E8ECEF; --muted:#A3AEB7; --faint:#66737D;
  --accent:#E2AA4F; --accent-ink:#141008; --accent-dim:rgba(226,170,79,.14);
  --late:#E58A6E; --danger:#E0705E;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --rcol:18px; --gap:14px; --head-h:110px;
  --c-appt:#E79BBE; --c-prep:#B8A0EE; --c-meal:#6FC2AF; --c-sleep:#80A9DE; --c-awake:#A7CC7D; --c-routine:#A3B6C7;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--ground);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 var(--mono);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
body.locked{overflow:hidden}
button{font:inherit;color:inherit}
.wrap{max-width:40rem;margin:0 auto;padding-inline:16px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bar);border-bottom:1px solid rgba(226,170,79,.45);box-shadow:0 12px 20px -14px rgba(0,0,0,.95)}
.top .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 12px;padding-block:20px 14px;align-items:center}
.date{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date::before{content:"› ";color:var(--accent);font-weight:500}
.nav{display:flex;gap:6px}
.sub{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;font-size:13.5px;color:var(--ink);border-top:1px solid var(--line-soft);padding-top:12px}
.sub>span:first-child{color:var(--accent)}
.sub .k{color:var(--muted);margin-right:6px}
.sub .today{border:1px solid var(--accent);background:none;color:var(--accent);font-size:12px;border-radius:4px;padding:2px 8px;cursor:pointer}
.icon-btn{width:40px;height:40px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn svg{width:18px;height:18px}
.icon-btn.sm{width:44px;height:44px;border:none;background:none;color:var(--muted)}

/* Timeline */
#timeline{padding-block:22px 64px;touch-action:pan-y;display:flex;flex-direction:column;gap:var(--gap)}
.blk{position:relative;display:grid;grid-template-columns:var(--rcol) minmax(0,1fr);scroll-margin-top:calc(var(--head-h) + 14px)}
.hrow{display:flex;align-items:flex-start;gap:12px}
.tbtn{flex:none;font:600 15px/1 var(--mono);letter-spacing:.02em;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:4px;padding:8px 7px 7px;cursor:pointer;min-height:34px;font-variant-numeric:tabular-nums}
.tbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbtn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.blk.now .tbtn{border-color:var(--accent);color:var(--accent)}
.blk.past .tbtn{color:var(--muted);background:transparent}
.shiftbar{display:flex;flex-direction:column;gap:10px;margin:12px 0 2px;padding:12px;border:1px solid var(--accent);border-radius:6px;background:var(--accent-dim)}
.shiftbar .sb-l{font-size:13px;color:var(--accent)}
.sb-btns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sb-btns .btn,.shiftbar .btn{padding-inline:4px;background:var(--panel)}
.shiftbar .btn.primary{background:var(--accent)}
.blk .rail{position:relative}
.blk .rail::before{content:"";position:absolute;left:50%;top:calc(var(--gap) / -2 - 1px);bottom:calc(var(--gap) / -2 - 1px);width:1px;background:var(--line);transform:translateX(-50%)}
.blk:first-of-type .rail::before{top:26px}
.blk.ty-prep{--type:var(--c-prep)} .blk.ty-meal{--type:var(--c-meal)} .blk.ty-sleep{--type:var(--c-sleep)} .blk.ty-awake{--type:var(--c-awake)} .blk.ty-routine{--type:var(--c-routine)}
.blk .node{position:absolute;left:50%;top:26px;margin-left:-4px;width:8px;height:8px;background:var(--type,var(--faint));transform:translateX(-50%)}
.panel{margin-left:6px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--type,var(--line));border-radius:6px;padding:12px 14px 14px;min-width:0;position:relative;overflow:hidden}

.blk.ty-sleep .panel{background:var(--night);border-color:var(--night-line);border-top-color:var(--type)}
.blk.ty-sleep .rail::before{width:3px;background:var(--night-bar)}


.blk.now .t{color:var(--accent)}
.blk.now .node{background:var(--accent)}
.blk.now .panel{border-color:var(--accent);background:var(--panel-hi);box-shadow:0 0 0 1px var(--accent),0 8px 24px -12px rgba(226,170,79,.35)}
.blk.ty-sleep.now .panel{background:var(--night)}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent-dim)}
.prog span{display:block;height:100%;background:var(--accent)}

.blk.past .t{color:var(--muted)}
.blk.past .panel{background:transparent;border-style:dashed;border-color:var(--line);border-top-width:1px;padding-block:8px}
.blk.past .hrow{align-items:center}
.blk.past .node{background:var(--faint)}
.blk.past .title{color:var(--muted)}

.head{all:unset;box-sizing:border-box;flex:1;min-width:0;display:flex;align-items:center;gap:10px;cursor:pointer;min-height:34px}
.hl{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.sl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.head:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.head .title{font-size:16px;font-weight:600;line-height:1.3;min-width:0;overflow-wrap:anywhere;padding-top:1px}
.head .tag{font-size:12px;color:var(--type);border:1px solid color-mix(in srgb,var(--type) 45%,transparent);border-radius:3px;padding:0 6px;line-height:1.6;align-self:center}
.blk.past .head .tag{color:var(--muted);border-color:var(--line)}
.head .meta{color:var(--muted);font-size:13px;white-space:nowrap}
.head>.meta{margin-left:auto}
.blk.now .head .meta{color:var(--accent)}
.head .edit{align-self:flex-start;margin-top:4px;color:var(--muted);display:grid}
.head .edit svg{width:15px;height:15px}

.meal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:12px 0 2px;font-size:14.5px}
.meal dt{color:var(--muted)}
.meal dd{margin:0}
.note{color:var(--muted);margin:12px 0 2px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.note::before{content:"# ";color:var(--faint)}

.checks{list-style:none;margin:10px 0 0;padding:4px 0 0;border-top:1px solid var(--line-soft)}
.blk.ty-sleep .checks{border-top-color:var(--night-line)}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:8px 0 4px;cursor:pointer}
.checks input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;margin:1px 0 0;border:1.5px solid var(--muted);border-radius:3px;background:transparent;display:grid;place-items:center;cursor:pointer}
.checks input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.checks input:checked{border-color:var(--accent);background:var(--accent-dim)}
.checks input:checked::after{content:"";width:9px;height:5px;border-left:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:translateY(-1px) rotate(-45deg)}
.checks .txt{min-width:0;overflow-wrap:anywhere;line-height:1.45;font-size:15px}
.checks input:checked + .txt .main{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.checks small{display:block;color:var(--muted);font-size:13px}
.checks small.late{color:var(--late)}
.checks li.rec .main::after{content:" ↻";color:var(--faint);font-size:12.5px}

.sun{display:grid;grid-template-columns:var(--rcol) minmax(0,1fr);align-items:center;font-size:13px;min-height:22px;margin-block:-2px}
.sun .rail{position:relative;align-self:stretch}
.sun .rail::before{content:"";position:absolute;left:50%;top:calc(var(--gap) / -2 - 1px);bottom:calc(var(--gap) / -2 - 1px);width:1px;background:var(--line);transform:translateX(-50%)}
.sun .lbl{padding-left:10px;color:var(--accent)}

.endrow{display:flex;gap:10px;padding-top:10px;margin-left:calc(var(--rcol) + 6px)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--accent);border-radius:6px;padding:10px 12px;font-size:13.5px}
.banner.warn{border-color:var(--danger);color:var(--danger)}

/* Buttons and fields */
.btn{font-size:14px;font-weight:500;border-radius:6px;padding:10px 14px;min-height:44px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none}
.btn:focus-visible,.icon-btn:focus-visible,.sub .today:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.small{min-height:38px;padding:7px 12px;font-size:13px}
.btn.grow{flex:1}
.btn.ghost{border:none;background:none;color:var(--muted);padding-inline:6px}
.btn.danger{color:var(--danger)}
.btn.link{border:none;background:none;color:var(--danger);padding:6px 0;min-height:36px;justify-content:flex-start}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.field>label,.lbl{font-size:13px;color:var(--muted)}
input[type=text],input[type=password],input[type=time],input[type=date],input[type=number],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid #46535E;border-radius:6px;padding:10px 12px;width:100%;min-height:46px;min-width:0}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;display:block}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{resize:vertical;line-height:1.45}
::placeholder{color:var(--faint);opacity:1}
input:focus,select:focus,textarea:focus{outline:1px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.items{display:flex;flex-direction:column;gap:8px}
.items:empty{display:none}
.item{display:flex;gap:4px;align-items:center}
.shift{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.shift .btn{padding-inline:4px}
.btn.wide{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border:1px solid var(--line);background:var(--field);border-radius:4px;padding:7px 11px;min-height:36px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.hint{color:var(--muted);font-size:13px;line-height:1.55;margin:0}
/* Middag */
.dish{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;width:100%;margin:12px 0 2px;padding:11px 12px;border:1px solid color-mix(in srgb,var(--c-meal) 45%,transparent);border-radius:6px;background:color-mix(in srgb,var(--c-meal) 7%,transparent);cursor:pointer}
.dish:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dish .dh{display:flex;gap:10px;align-items:baseline}
.dish .dn{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.dish .swap{font-size:12px;color:var(--c-meal)}
.dish .dm,.dish .dk{font-size:13px;color:var(--muted);line-height:1.45}
.pick{margin-top:6px;padding-inline:0;color:var(--c-meal)}
.rowline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.rowline .rl{font-size:13px;color:var(--muted);margin-right:2px}
.chip.sm{min-height:36px;padding:5px 11px;font-size:13px}
.chip.rate.r-godt{border-color:var(--c-meal);color:var(--c-meal)}
.chip.rate.r-middels{border-color:var(--accent);color:var(--accent)}
.chip.rate.r-lite{border-color:var(--late);color:var(--late)}
.checks li.gen .main{color:var(--c-meal)}
.checks li.gen input:checked + .txt .main{color:var(--muted)}
/* Søvnlogg */
.log{margin-top:12px;padding-top:12px;border-top:1px solid var(--night-line);display:flex;flex-direction:column;gap:10px}
.lg-h{font-size:13px;color:var(--c-sleep)}
.log.night{border-top-color:var(--line-soft)}
.lg-row{display:grid;grid-template-columns:4.6rem minmax(0,1fr) auto;gap:10px;align-items:center;min-height:38px}
.kn{font-size:13.5px}
.lg-t{all:unset;cursor:pointer;font-size:13px;color:var(--ink);justify-self:start;border-bottom:1px dashed var(--faint);padding-block:2px}
.lg-t:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lg-sum{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lg-sum .m{color:var(--muted);font-size:12.5px}
/* Lister og tabeller i ark */
.list .row.cur{background:var(--accent-dim)}
.list .wd{color:var(--accent);margin-right:4px}
.list .rates{display:flex;gap:6px;margin-left:auto}
.dcard{display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.dcard .m{color:var(--muted);font-size:12.5px}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
.tbl th{color:var(--muted);font-weight:500;text-align:left;padding:6px 8px 8px 0}
.tbl td{padding:9px 8px 9px 0;border-top:1px solid var(--line-soft)}
.tbl tr[data-day]{cursor:pointer}
.tbl .faint{color:var(--faint)}
.tbl .acc{color:var(--accent)}
.endrow .btn{flex:1}
.endrow{flex-wrap:wrap}
.nowbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line-soft);padding-top:10px}
.nb-txt{all:unset;box-sizing:border-box;flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;cursor:pointer}
.nb-txt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nb-1{font-size:14px;font-weight:600;color:var(--accent);overflow-wrap:anywhere}
.nb-2{font-size:12.5px;color:var(--muted)}
.nb-act{flex:none;max-width:52%;white-space:normal;line-height:1.2}
.fab{position:fixed;right:max(16px,calc((100vw - 40rem) / 2 + 16px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:54px;height:54px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.45);cursor:pointer}
.fab:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#timeline{padding-bottom:96px}
.appt-row{display:grid;grid-template-columns:var(--rcol) minmax(0,1fr)}
.appt-row .rail{position:relative}
.appt-row .rail::before{content:"";position:absolute;left:50%;top:calc(var(--gap) / -2 - 1px);bottom:calc(var(--gap) / -2 - 1px);width:1px;background:var(--line);transform:translateX(-50%)}
.appt{all:unset;box-sizing:border-box;margin-left:6px;display:flex;flex-direction:column;gap:3px;padding:10px 14px;border:1px solid var(--c-appt);border-left-width:4px;border-radius:6px;background:color-mix(in srgb,var(--c-appt) 9%,var(--panel));cursor:pointer}
.appt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ap-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ap-t{font-weight:600;color:var(--c-appt)}
.ap-n{font-weight:600}
.appt .tag{font-size:12px;color:var(--c-appt);border:1px solid color-mix(in srgb,var(--c-appt) 45%,transparent);border-radius:3px;padding:0 6px}
.appt .sm{font-size:13px;color:var(--muted)}
.tomorrow{margin-top:12px;padding:12px;border:1px dashed var(--line);border-radius:6px}
.tm-h{display:block;font-size:13px;color:var(--accent);margin-bottom:6px}
.tomorrow dl{display:grid;grid-template-columns:6.8rem minmax(0,1fr);gap:4px 12px;margin:0;font-size:13.5px}
.tomorrow dt{color:var(--muted)}
.tomorrow dd{margin:0;overflow-wrap:anywhere}
.list .row[class*="tb-"]{border-left:3px solid var(--line)}
.list .tb-prep{border-left-color:var(--c-prep)!important}.list .tb-meal{border-left-color:var(--c-meal)!important}.list .tb-sleep{border-left-color:var(--c-sleep)!important}.list .tb-awake{border-left-color:var(--c-awake)!important}.list .tb-routine{border-left-color:var(--c-routine)!important}
.wx{margin:12px 0 0;font-size:13.5px;color:var(--ink)}
.wx-k{color:var(--c-awake);margin-right:8px}
.sugg{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sugg .rl{font-size:13px;color:var(--muted)}
.sg{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;width:100%;padding:9px 12px;border:1px solid color-mix(in srgb,var(--c-awake) 40%,transparent);border-radius:6px;background:color-mix(in srgb,var(--c-awake) 6%,transparent);cursor:pointer}
.sg:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sg .sn,.pick .sn{font-weight:600;overflow-wrap:anywhere}
.sg .sm,.pick .sm{font-size:13px;color:var(--muted);line-height:1.45}
.sugg .more{align-self:flex-start;padding-inline:0;color:var(--c-awake)}
.pick{display:flex;flex-direction:column;gap:3px;margin-top:12px;padding:10px 12px;border:1px solid var(--c-awake);border-radius:6px;background:color-mix(in srgb,var(--c-awake) 10%,transparent)}
.pk-h{display:flex;align-items:center;gap:10px;justify-content:space-between}
.pk-h .btn{min-height:32px;padding:4px 6px;color:var(--c-awake)}
.lnk{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.sel-sm{width:auto;min-width:6.5rem;min-height:40px;padding-block:6px}
.warn-text{color:var(--danger)}
.grp .chip{align-self:flex-start}

/* Sheet */
#sheet-root{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;max-width:40rem;margin:0 auto;background:var(--ground);border:1px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
#sheet-root.open .scrim{opacity:1}
#sheet-root.open .sheet{transform:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 12px 14px 20px;border-bottom:1px solid rgba(226,170,79,.45);background:var(--bar);border-radius:10px 10px 0 0}
.sh-head h2{font-size:17px;font-weight:600;margin:0}
.sh-head h2::before{content:"› ";color:var(--accent)}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:16px 14px 28px;display:flex;flex-direction:column;gap:14px}
.sh-foot{display:flex;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bar)}
.grp{display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}

/* Toast */

#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}

@media (prefers-reduced-motion: reduce){
  .sheet,.scrim,#toast{transition:none}
}

<script>
'use strict';
/* ============================================================
   Døgn – dagsplan for permisjonen
   Data ligger i IndexedDB (med localStorage som reserve).
   Datastrukturen har versjonsnummer (DATA_VERSION) slik at
   nye versjoner av appen kan oppgradere lagrede data trygt.
   ============================================================ */
const APP_VERSION = '1.7.0';
const DATA_VERSION = 4;
const DAY_END = 22 * 60;                      // siste rubrikk varer til kl. 22

const TYPES = { prep: 'Forberedelse', meal: 'Måltid', sleep: 'Søvn', awake: 'Våkentid', routine: 'Rutine' };
const CATS = { fisk: 'fisk', kjott: 'kjøtt', kylling: 'kylling', vegetar: 'vegetar', annet: 'annet' };
const MEALS = { dinner: 'Middag', lunch: 'Lunsj' };
const RATES = ['', 'godt', 'middels', 'lite'];
const WD = ['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
const WD_SHORT = ['Man','Tir','Ons','Tor','Fre','Lør','Søn'];   // ISO 1–7
const MO = ['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
const MO_SHORT = ['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];

/* ---------- hjelpefunksjoner ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const toHM = m => { m = Math.max(0, Math.min(24 * 60 - 1, Math.round(m))); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const fmtT = s => s;
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);   // b − a
const todayISO = () => iso(new Date());
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const isoWd = s => ((parseISO(s).getDay() + 6) % 7) + 1;
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDateLong = s => { const d = parseISO(s); return cap(WD[d.getDay()]) + ' ' + d.getDate() + '. ' + MO[d.getMonth()]; };
const fmtDateShort = s => { const d = parseISO(s); return d.getDate() + '. ' + MO_SHORT[d.getMonth()]; };
const fmtDateTiny = s => { const d = parseISO(s); return WD_SHORT[isoWd(s) - 1].toLowerCase() + ' ' + d.getDate() + '.' + (d.getMonth() + 1); };
const fmtDur = m => m < 60 ? m + ' min' : (m % 60 ? Math.floor(m / 60) + ' t ' + (m % 60) + ' min' : (m / 60) + ' t');
const fmtDurShort = m => m < 60 ? m + 'm' : Math.floor(m / 60) + 't' + pad(m % 60);
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

/* ---------- startdata ---------- */
function seedDishes() {
  const D = (id, name, meal, minutes, cat, x = {}) => ({ id, name, meal, minutes, cat, weekday: x.weekday || 0, kids: x.kids || '', prep: x.prep || '', dayBefore: x.dayBefore || '' });
  return [
    D('d-pizza',       'Pizza',                                   'dinner', 40, 'annet',   { weekday: 5, kids: 'Mindre ost og skinke på guttenes del. Skjær i strimler.', prep: 'Lag deigen og la den heve' }),
    D('d-taco',        'Taco',                                    'dinner', 25, 'kjott',   { weekday: 6, kids: 'Ta ut guttenes kjøttdeig før tacokrydderet. Grønnsaker i små biter, lefse i strimler.', prep: 'Kutt grønnsaker' }),
    D('d-fiskekaker',  'Fiskekaker med potet og gulrot',          'dinner', 25, 'fisk',    { kids: 'Velg fiskekaker med lite salt. Mos potet og gulrot.', prep: 'Skrell potet og gulrot' }),
    D('d-fiskeboller', 'Fiskeboller i hvit saus med potet',       'dinner', 25, 'fisk',    { kids: 'Del fiskebollene i små biter.', prep: 'Skrell potet og gulrot' }),
    D('d-laks',        'Laks i ovn med potet og brokkoli',        'dinner', 30, 'fisk',    { kids: 'Sjekk for bein. Mos laks og potet med litt smør.', prep: 'Skrell potet', dayBefore: 'Tin laks i kjøleskapet' }),
    D('d-torsk',       'Torsk i ovn med ris og grønnsaker',       'dinner', 30, 'fisk',    { kids: 'Sjekk for bein.', prep: 'Kutt grønnsaker', dayBefore: 'Tin torsk i kjøleskapet' }),
    D('d-fiskegrateng','Fiskegrateng med revet gulrot',           'dinner', 50, 'fisk',    { kids: 'Passer godt som den er.', prep: 'Kok makaroni og gjør gratengen klar til ovnen' }),
    D('d-kjottkaker',  'Kjøttkaker med potet og ertestuing',      'dinner', 40, 'kjott',   { kids: 'Lite salt i farsen. Lag noen små kaker til guttene.', prep: 'Skrell potet, lag farse' }),
    D('d-bolognese',   'Spaghetti bolognese med revet gulrot',    'dinner', 30, 'kjott',   { kids: 'Kutt spaghettien i biter. Lite salt.', prep: 'Riv gulrot og hakk løk' }),
    D('d-kyllinggryte','Mild kyllinggryte med ris',               'dinner', 30, 'kylling', { kids: 'Kutt kyllingen i små biter.', prep: 'Kutt kylling og grønnsaker' }),
    D('d-kyllingovn',  'Kyllinglår i ovn med søtpotet',           'dinner', 45, 'kylling', { kids: 'Fjern skinn og bein. Mos søtpoteten.', prep: 'Skrell og kutt søtpotet' }),
    D('d-kyllingwok',  'Mild kyllingwok med nudler',              'dinner', 20, 'kylling', { kids: 'Klipp nudlene. Ta ut guttenes porsjon før soyasaus.', prep: 'Kutt grønnsaker' }),
    D('d-omelett',     'Grønnsaksomelett med grovbrød',           'dinner', 15, 'vegetar', { kids: 'Stek eggene helt gjennom.' }),
    D('d-tomatsuppe',  'Tomatsuppe med makaroni og egg',          'dinner', 20, 'vegetar', { kids: 'La suppa kjøle seg. Kutt egget i biter.' }),
    D('d-pannekaker',  'Pannekaker med blåbær',                   'dinner', 30, 'vegetar', { kids: 'Lite sukker. Blåbærene moses eller deles.', prep: 'Rør røren og la den svelle' }),
    D('l-risgrot',     'Risgrynsgrøt',                            'lunch',  60, 'vegetar', { weekday: 6, kids: 'Lite eller ikke sukker og kanel på guttenes porsjon.', prep: 'Sett på grøten, den koker i ca. 45 min og må røres i' }),
  ];
}

function seed() {
  const L0 = todayISO();
  const T = (key, name, rows) => ({
    id: key, name,
    blocks: rows.map(([slot, type, start, title, x = {}]) => ({
      id: key + '.' + slot, slot, type, start, title,
      items: (x.items || []).map((t, i) => ({ id: key + '.' + slot + '.' + i, text: t })),
      boys: x.boys || '', adults: x.adults || '', note: x.note || '', link: x.link || ''
    }))
  });
  const toLurer = T('to-lurer', 'To lurer', [
    ['morgen',     'prep',    '06:30', 'Forberedelser',     { items: ['Trakte kaffe', 'Varme melk', 'Lage havregrøt til frokost'] }],
    ['mme-morgen', 'meal',    '07:00', 'Henting og MME',    { boys: 'MME (flaske)', items: ['Bleieskift', 'Påkledning'] }],
    ['vaken1',     'awake',   '07:15', 'Våkentid',          { note: 'Aktivitet inne' }],
    ['frokost',    'meal',    '08:15', 'Frokost',           { boys: 'Havregrøt', adults: 'Havregrøt' }],
    ['vaken-kort', 'awake',   '08:45', 'Våkentid',          { note: 'Stell og rolig lek' }],
    ['lur1',       'sleep',   '09:15', 'Lur',               { items: ['Dusj'] }],
    ['opp1',       'routine', '10:45', 'Opp',               { items: ['Bleieskift'] }],
    ['lunsj',      'meal',    '11:00', 'Lunsj',             { boys: 'Ferdiglaget', adults: 'Egen lunsj', link: 'lunch' }],
    ['vaken2',     'awake',   '11:30', 'Våkentid',          { note: 'Ute eller tur mens det er lyst' }],
    ['middag',     'meal',    '13:30', 'Middag',            { boys: 'Ferdiglaget' }],
    ['lur2',       'sleep',   '14:15', 'Lur',               {}],
    ['vaken3',     'awake',   '15:30', 'Våkentid',          {}],
    ['kvelds',     'meal',    '17:30', 'Kvelds og middag',  { boys: 'Ferdiglaget', adults: 'Middag', link: 'dinner' }],
    ['vaken4',     'awake',   '18:00', 'Våkentid',          { note: 'Rolig inne' }],
    ['legg',       'routine', '18:30', 'Leggeforberedelse', { items: ['Tannpuss', 'Pysj'] }],
    ['legging',    'meal',    '19:00', 'MME og legging',    { boys: 'MME (flaske)' }],
    ['kveld',      'routine', '19:30', 'Nullstilling',      { items: ['Blande MME til i morgen', 'Rydde spisestuen', 'Ta oppvask', 'Se over morgendagen'] }],
  ]);
  const enLur = T('en-lur', 'Én lur', [
    ['morgen',     'prep',    '06:30', 'Forberedelser',     { items: ['Trakte kaffe', 'Varme melk', 'Lage havregrøt til frokost'] }],
    ['mme-morgen', 'meal',    '07:00', 'Henting og MME',    { boys: 'MME (flaske)', items: ['Bleieskift', 'Påkledning'] }],
    ['vaken1',     'awake',   '07:15', 'Våkentid',          { note: 'Aktivitet inne' }],
    ['frokost',    'meal',    '08:15', 'Frokost',           { boys: 'Havregrøt', adults: 'Havregrøt' }],
    ['vaken2',     'awake',   '08:45', 'Våkentid',          { note: 'Ute eller tur mens det er lyst' }],
    ['lunsj',      'meal',    '11:15', 'Lunsj',             { boys: 'Ferdiglaget', adults: 'Egen lunsj', link: 'lunch' }],
    ['lur1',       'sleep',   '12:00', 'Lur',               { items: ['Dusj'] }],
    ['opp1',       'routine', '14:30', 'Opp',               { items: ['Bleieskift'] }],
    ['middag',     'meal',    '14:45', 'Middag',            { boys: 'Ferdiglaget' }],
    ['vaken3',     'awake',   '15:15', 'Våkentid',          {}],
    ['kvelds',     'meal',    '17:30', 'Kvelds og middag',  { boys: 'Ferdiglaget', adults: 'Middag', link: 'dinner' }],
    ['vaken4',     'awake',   '18:00', 'Våkentid',          { note: 'Rolig inne' }],
    ['legg',       'routine', '18:30', 'Leggeforberedelse', { items: ['Tannpuss', 'Pysj'] }],
    ['legging',    'meal',    '19:00', 'MME og legging',    { boys: 'MME (flaske)' }],
    ['kveld',      'routine', '19:30', 'Nullstilling',      { items: ['Blande MME til i morgen', 'Rydde spisestuen', 'Ta oppvask', 'Se over morgendagen'] }],
  ]);
  return {
    version: DATA_VERSION,
    leave: { start: L0, end: addDays(L0, 91) },
    kids: [{ id: 'b1', name: 'Barn 1' }, { id: 'b2', name: 'Barn 2' }],
    place: null,
    partner: defaultPartner(),
    templates: { 'to-lurer': toLurer, 'en-lur': enLur },
    schedule: [{ from: L0, templateId: 'to-lurer' }],
    tasks: [
      { id: 't-stov-oppe', text: 'Støvsuge oppe',    slot: 'lur1', type: 'sleep',   rule: { kind: 'interval', every: 7,  start: addDays(L0, 0) } },
      { id: 't-stov-nede', text: 'Støvsuge nede',    slot: 'lur1', type: 'sleep',   rule: { kind: 'interval', every: 7,  start: addDays(L0, 2) } },
      { id: 't-bad-oppe',  text: 'Vaske badet oppe', slot: 'lur1', type: 'sleep',   rule: { kind: 'interval', every: 14, start: addDays(L0, 1) } },
      { id: 't-bad-nede',  text: 'Vaske badet nede', slot: 'lur1', type: 'sleep',   rule: { kind: 'interval', every: 14, start: addDays(L0, 8) } },
      { id: 't-bad',       text: 'Bad',              slot: 'legg', type: 'routine', rule: { kind: 'interval', every: 6,  start: addDays(L0, 3) } },
    ],
    dishes: seedDishes(),
    activities: seedActivities(),
    menu: {},
    menuWeeks: {},
    settings: { fishPerWeek: 2, show: { nowbar: true, tomorrow: true, gear: true }, packList: DEFAULT_PACK.slice() },
    appts: [],
    days: {},
    meta: { created: todayISO(), lastExport: null, setupDone: false }
  };
}

function migrate(s) {
  if (!s || typeof s !== 'object' || !s.templates || typeof s.templates !== 'object') throw new Error('Filen er ikke en backup fra Døgn.');
  const base = seed();
  s.version = s.version || 1;
  if (s.version > DATA_VERSION) throw new Error('Backupen er laget med en nyere versjon av Døgn.');
  s.leave = s.leave || base.leave;
  s.schedule = Array.isArray(s.schedule) && s.schedule.length ? s.schedule : [{ from: s.leave.start, templateId: Object.keys(s.templates)[0] }];
  s.tasks = Array.isArray(s.tasks) ? s.tasks : [];
  s.days = s.days || {};
  s.meta = Object.assign({ created: todayISO(), lastExport: null }, s.meta || {});
  if (s.version < 2) {
    // v2: middagsbank, ukemeny og logg. Måltidsrubrikkene kobles til banken,
    // og det faste punktet «Forberede voksenmiddag» erstattes av rettens egen forberedelse.
    const fix = blocks => blocks.forEach(b => {
      if (b.link === undefined) b.link = b.slot === 'kvelds' ? 'dinner' : b.slot === 'lunsj' ? 'lunch' : '';
      b.items = (b.items || []).filter(it => it.text !== 'Forberede voksenmiddag');
    });
    Object.values(s.templates).forEach(t => fix(t.blocks));
    Object.values(s.days).forEach(d => { if (d.blocks) fix(d.blocks); });
    s.version = 2;
  }
  s.kids = Array.isArray(s.kids) && s.kids.length ? s.kids : base.kids;
  s.dishes = Array.isArray(s.dishes) ? s.dishes : base.dishes;
  s.menu = s.menu || {};
  s.menuWeeks = s.menuWeeks || {};
  s.settings = Object.assign({ fishPerWeek: 2 }, s.settings || {});
  if (s.version < 3) {
    // v3: generisk app. Data fra før v3 er satt opp for Nesttun og er ferdig oppsatt.
    if (s.place === undefined) s.place = { name: 'Nesttun', lat: 60.3197, lon: 5.3536 };
    s.meta.setupDone = true;
    s.version = 3;
  }
  if (s.place === undefined) s.place = null;
  s.partner = Object.assign(defaultPartner(), s.partner || {});
  s.partner.codes = s.partner.codes || {};
  s.partner.shifts = s.partner.shifts || {};
  if (s.meta.setupDone === undefined) s.meta.setupDone = true;
  if (s.version < 4) { if (!Array.isArray(s.activities)) s.activities = seedActivities(); s.version = 4; }
  if (!Array.isArray(s.activities)) s.activities = seedActivities();
  if (!Array.isArray(s.appts)) s.appts = [];
  s.settings.show = Object.assign({ nowbar: true, tomorrow: true, gear: true }, s.settings.show || {});
  if (!Array.isArray(s.settings.packList)) s.settings.packList = DEFAULT_PACK.slice();
  // Rydd bort huskepunkter som ble krysset av for mer enn 30 dager siden
  s.tasks = s.tasks.filter(t => !(t.rule && t.rule.kind === 'once') || !Object.keys(s.days).some(d => s.days[d].done && s.days[d].done[t.id] && d < addDays(todayISO(), -30)));
  // (Fremtidige oppgraderinger: if (s.version < 4) { … ; s.version = 4; })
  return s;
}

/* ---------- lagring ---------- */
const store = {
  db: null, ok: true,
  async init() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('dogn', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch (e) { this.db = null; }
  },
  async get() {
    if (this.db) {
      try {
        const v = await new Promise((res, rej) => {
          const q = this.db.transaction('kv').objectStore('kv').get('state');
          q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
        });
        if (v) return JSON.parse(v);
      } catch (e) {}
    }
    try { const s = localStorage.getItem('dogn-state'); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  },
  async getKey(key) {
    if (this.db) {
      try {
        const v = await new Promise((res, rej) => { const q = this.db.transaction('kv').objectStore('kv').get(key); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
        if (v) return JSON.parse(v);
      } catch (e) {}
    }
    try { const v = localStorage.getItem('dogn-' + key); return v ? JSON.parse(v) : null; } catch (e) { return null; }
  },
  async setKey(key, obj) {
    const json = JSON.stringify(obj);
    if (this.db) { try { const t = this.db.transaction('kv', 'readwrite'); t.objectStore('kv').put(json, key); } catch (e) {} }
    try { localStorage.setItem('dogn-' + key, json); } catch (e) {}
  },
  async set(obj) {
    const json = JSON.stringify(obj);
    let okAny = false;
    if (this.db) {
      try {
        await new Promise((res, rej) => {
          const t = this.db.transaction('kv', 'readwrite');
          t.objectStore('kv').put(json, 'state');
          t.oncomplete = res; t.onerror = () => rej(t.error);
        });
        okAny = true;
      } catch (e) {}
    }
    try { localStorage.setItem('dogn-state', json); okAny = true; } catch (e) {}
    if (okAny !== this.ok) { this.ok = okAny; renderTimeline(); }
  }
};
let saveTimer = null;
function persist() { clearTimeout(saveTimer); saveTimer = setTimeout(() => { store.set(state); markDirty(); }, 250); }
function flush() { clearTimeout(saveTimer); if (state) store.set(state); }

/* ---------- tilstand ---------- */
let state = null;
let view = todayISO();
let lastToday = todayISO();
const expanded = new Set();
let shiftOpen = null;   // id til bolken som har flyttelinjen åpen
let reopen = null;      // arket som skal vises igjen etter «Angre»

function dayRec(date) { return (state.days[date] ??= { done: {} }); }
function logRec(date) { const d = dayRec(date); return (d.log ??= { sleep: [], night: {}, meals: {}, note: '' }); }
function getLog(date) { const d = state.days[date]; return (d && d.log) || { sleep: [], night: {}, meals: {}, note: '' }; }
function scheduledTemplate(date) {
  const sch = [...state.schedule].sort((a, b) => a.from.localeCompare(b.from));
  let t = sch[0].templateId;
  for (const s of sch) if (s.from <= date) t = s.templateId;
  return state.templates[t] ? t : Object.keys(state.templates)[0];
}
function templateFor(date) {
  const d = state.days[date];
  if (d && d.templateId && state.templates[d.templateId]) return d.templateId;
  return scheduledTemplate(date);
}
function sortBlocks(arr) { arr.sort((a, b) => toMin(a.start) - toMin(b.start)); return arr; }
function blocksFor(date) {
  const d = state.days[date];
  return sortBlocks(d && d.blocks ? d.blocks : state.templates[templateFor(date)].blocks);
}
function ensureDayBlocks(date) {
  const d = dayRec(date);
  if (!d.blocks) d.blocks = clone(blocksFor(date));
  return d.blocks;
}
function endOf(blocks, i) {
  return i + 1 < blocks.length ? toMin(blocks[i + 1].start) : Math.max(toMin(blocks[i].start) + 30, DAY_END);
}
function isDone(date, id) { return !!(state.days[date] && state.days[date].done && state.days[date].done[id]); }
function kidName(id) { const k = state.kids.find(x => x.id === id); return k ? k.name : id; }

const undoStack = [];
function mutate(msg, fn) {
  const snap = JSON.stringify(state);
  const r = fn();
  if (typeof r === 'string' && r) msg = r;
  undoStack.push({ snap, label: msg });
  if (undoStack.length > 15) undoStack.shift();
  persist();
  render();
  toast(msg, true);
}
function undoLast() {
  const u = undoStack.pop();
  if (!u) return;
  state = JSON.parse(u.snap);
  persist();
  render();
  if (sheetOpen() && reopen) reopen();
  toast('Angret: ' + u.label);
}

/* ---------- gjentakende gjøremål ---------- */
function ruleText(r) {
  if (r.kind === 'once') return 'Én gang, ' + fmtDateShort(r.start);
  if (r.kind === 'daily') return 'Hver dag';
  if (r.kind === 'weekdays') return (r.days || []).slice().sort().map(d => WD_SHORT[d - 1]).join(', ') || 'Ingen dager valgt';
  if (r.every === 7) return 'Hver uke';
  if (r.every === 14) return 'Annenhver uke';
  if (r.every === 1) return 'Hver dag';
  return 'Hver ' + r.every + '. dag';
}
function completions(taskId) {
  return Object.keys(state.days).filter(d => state.days[d].done && state.days[d].done[taskId]).sort();
}
function taskStatus(task, date) {
  const done = isDone(date, task.id);
  const r = task.rule || { kind: 'daily' };
  const start = r.start || '0000-01-01';
  if (date < start) return { show: done, done, late: 0 };
  if (r.kind === 'daily') return { show: true, done, late: 0 };
  if (r.kind === 'once') {
    if (completions(task.id).some(d => d < date)) return { show: false, done, late: 0 };
    return { show: true, done, late: done ? 0 : diffDays(start, date) };
  }
  if (r.kind === 'weekdays') return { show: done || (r.days || []).includes(isoWd(date)), done, late: 0 };
  const every = Math.max(1, Number(r.every) || 1);
  const prev = completions(task.id).filter(d => d < date).pop();
  const dueFrom = prev ? addDays(prev, every) : start;
  return { show: done || date >= dueFrom, done, late: done ? 0 : Math.max(0, diffDays(dueFrom, date)), prev };
}
function placeTasks(date, blocks) {
  const map = {};
  for (const t of state.tasks) {
    const st = taskStatus(t, date);
    if (!st.show) continue;
    const b = blocks.find(x => x.slot === t.slot) || blocks.find(x => x.type === t.type) || blocks[blocks.length - 1];
    if (!b) continue;
    (map[b.id] ??= []).push({ task: t, st });
  }
  return map;
}
function allSlots() {
  const first = templateFor(view);
  const ids = [first, ...Object.keys(state.templates).filter(k => k !== first)];
  const seen = new Map();
  for (const id of ids) for (const b of sortBlocks([...state.templates[id].blocks])) {
    if (!seen.has(b.slot)) seen.set(b.slot, { slot: b.slot, type: b.type, label: b.title + ' ' + fmtT(b.start), min: toMin(b.start) });
  }
  return [...seen.values()].sort((a, b) => a.min - b.min);
}

/* ---------- middagsbank og ukemeny ---------- */
const weekStart = d => addDays(d, 1 - isoWd(d));
function dishById(id) { return state.dishes.find(x => x.id === id); }
function setMenu(d, meal, dish, manual) { (state.menu[d] ??= {})[meal] = { dish, manual }; }
function lastServed(dishId, before) {
  let last = null;
  for (const [d, m] of Object.entries(state.menu)) {
    if (d >= before) continue;
    for (const k of ['dinner', 'lunch']) if (m[k] && m[k].dish === dishId && (!last || d > last)) last = d;
  }
  return last;
}
/* Lager meny for én uke. Faste ukedager først, så fisk spredt utover uka,
   deretter rettene som er spist for lengst siden. Manuelle valg røres ikke. */
function generateWeek(ws, from) {
  for (const meal of ['dinner', 'lunch']) {
    const week = [...Array(7)].map((_, i) => addDays(ws, i));
    const days = week.filter(d => !from || d >= from);
    const used = new Set();
    week.forEach(d => { const m = state.menu[d] && state.menu[d][meal]; if (m && m.dish && (m.manual || (from && d < from))) used.add(m.dish); });
    const free = [];
    for (const d of days) {
      const cur = state.menu[d] && state.menu[d][meal];
      if (cur && cur.manual) continue;
      const fixed = state.dishes.find(x => x.meal === meal && Number(x.weekday) === isoWd(d));
      if (fixed) { setMenu(d, meal, fixed.id, false); used.add(fixed.id); }
      else { if (state.menu[d]) delete state.menu[d][meal]; if (meal === 'dinner') free.push(d); }
    }
    if (!free.length) continue;
    const pool = state.dishes.filter(x => x.meal === meal && !Number(x.weekday));
    if (!pool.length) continue;
    const stale = arr => arr.map(x => ({ x, l: lastServed(x.id, ws) || '' }))
      .sort((a, b) => a.l.localeCompare(b.l) || a.x.name.localeCompare(b.x.name)).map(o => o.x);
    let fishHave = 0;
    week.forEach(d => { if (free.includes(d)) return; const m = state.menu[d] && state.menu[d][meal]; const di = m && dishById(m.dish); if (di && di.cat === 'fisk') fishHave++; });
    const fishN = Math.max(0, Math.min(free.length, (Number(state.settings.fishPerWeek) || 0) - fishHave));
    const fish = stale(pool.filter(x => x.cat === 'fisk' && !used.has(x.id))).slice(0, fishN);
    const others = stale(pool.filter(x => x.cat !== 'fisk' && !used.has(x.id)));
    const slots = new Array(free.length).fill(null);
    fish.forEach((f, i) => { let p = Math.floor((i + 0.5) * free.length / fish.length); while (slots[p]) p = (p + 1) % free.length; slots[p] = f; });
    // Fyll resten med retten som er spist for lengst siden, men unngå samme type to dager på rad.
    let queue = others.length ? others.slice() : stale(pool);
    const catOf = i => { if (i < 0) { const m = state.menu[addDays(free[0], -1)]; const di = m && m[meal] && dishById(m[meal].dish); return di ? di.cat : ''; } return slots[i] ? slots[i].cat : ''; };
    for (let i = 0; i < slots.length; i++) {
      if (slots[i]) continue;
      if (!queue.length) queue = others.length ? others.slice() : stale(pool);
      const prevCat = catOf(i - 1), nextCat = i + 1 < slots.length && slots[i + 1] ? slots[i + 1].cat : '';
      let j = queue.findIndex(x => x.cat !== prevCat && x.cat !== nextCat);
      if (j < 0) j = queue.findIndex(x => x.cat !== prevCat);
      if (j < 0) j = 0;
      slots[i] = queue.splice(j, 1)[0];
    }
    free.forEach((d, i) => setMenu(d, meal, slots[i].id, false));
  }
}
function ensureWeek(date) {
  const ws = weekStart(date);
  if (state.menuWeeks[ws]) return;
  generateWeek(ws, null);
  state.menuWeeks[ws] = true;
  persist();
}
function regenerateFrom(from) {
  const weeks = new Set(Object.keys(state.menuWeeks).filter(ws => addDays(ws, 6) >= from));
  weeks.add(weekStart(from));
  [...weeks].sort().forEach(ws => { generateWeek(ws, from); state.menuWeeks[ws] = true; });
}
function dishFor(date, meal) {
  ensureWeek(date);
  const m = state.menu[date] && state.menu[date][meal];
  return m && m.dish ? dishById(m.dish) || null : null;
}
function dishMeta(d) {
  return d.minutes + ' min, ' + CATS[d.cat] + (Number(d.weekday) ? ', fast ' + WD_SHORT[d.weekday - 1].toLowerCase() : '');
}
/* Forberedelser som følger av menyen: i luren før måltidet, og kvelden før. */
function genRows(date, blocks) {
  const map = {};
  const add = (b, row) => { if (b) (map[b.id] ??= []).push(row); };
  blocks.forEach(b => {
    if (!b.link) return;
    const dish = dishFor(date, b.link);
    if (!dish) return;
    const start = toMin(b.start);
    const before = blocks.filter(x => toMin(x.start) < start);
    const target = before.filter(x => x.type === 'sleep').pop() || before.pop();
    add(target, { id: 'gen-prep-' + b.link, text: 'Forberede ' + MEALS[b.link].toLowerCase() + ': ' + dish.name, sub: dish.prep || '', gen: true });
  });
  const tomorrow = addDays(date, 1);
  const eve = blocks.find(x => x.slot === 'kveld') || blocks[blocks.length - 1];
  if (!syncOn() && isoWd(date) === 7) add(eve, { id: 'gen-backup', text: 'Ta backup', sub: 'Eksporter fil og lagre den i iCloud Drive eller Filer', gen: true });
  blocksFor(tomorrow).forEach(b => {
    if (!b.link) return;
    const dish = dishFor(tomorrow, b.link);
    if (dish && dish.dayBefore) add(eve, { id: 'gen-ahead-' + b.link, text: 'Til i morgen: ' + dish.dayBefore, sub: MEALS[b.link] + ': ' + dish.name, gen: true });
  });
  return map;
}

/* ---------- logg ---------- */
function napEntry(date, kid, blockId) { return getLog(date).sleep.find(e => e.kid === kid && e.blockId === blockId); }
function napTotal(date, kid) {
  return getLog(date).sleep.filter(e => e.kid === kid && e.start && e.end)
    .reduce((s, e) => s + Math.max(0, toMin(e.end) - toMin(e.start)), 0);
}
const MAX_AUTO_SHIFT = 180;   // større avvik enn 3 timer antas å være feiltrykk
function shiftNote(oldMin, b) {
  const delta = toMin(b.start) - oldMin;
  if (!delta) return '';
  return ' ' + (b.title || 'Neste bolk') + ' starter ' + b.start + ' (' + (delta > 0 ? '+' : '−') + fmtDur(Math.abs(delta)) + ').';
}
/* Flytter bare starten på én bolk. Bolken før blir kortere eller lengre, resten av dagen står.
   Kolliderer den med bolkene etter, skyves de akkurat nok til å få 15 minutter hver. */
function moveStart(id, newMin) {
  const arr = ensureDayBlocks(view);
  sortBlocks(arr);
  const i = arr.findIndex(x => x.id === id);
  if (i < 0) return null;
  if (i > 0) newMin = Math.max(newMin, toMin(arr[i - 1].start) + 5);
  arr[i].start = toHM(newMin);
  for (let k = i + 1; k < arr.length; k++) {
    if (toMin(arr[k].start) >= toMin(arr[k - 1].start) + 15) break;
    arr[k].start = toHM(toMin(arr[k - 1].start) + 15);
  }
  return arr[i];
}
/* Søvnklokken for lurer. Første «sovnet» setter lurens start til nå.
   Når siste gutt våkner, starter neste bolk nå. Resten av dagen står der den står. */
function logSleepNow(date, blockId, kids) {
  const L = logRec(date), now = nowMin(), t = toHM(now);
  const had = L.sleep.some(x => x.blockId === blockId);
  let ended = false;
  const msgs = [];
  kids.forEach(kid => {
    let e = L.sleep.find(x => x.kid === kid && x.blockId === blockId);
    if (!e) { L.sleep.push({ id: 's-' + uid(), kid, blockId, start: t, end: '' }); msgs.push('sovnet'); }
    else if (!e.end) { e.end = t; ended = true; msgs.push('våknet'); }
  });
  let msg = (kids.length > 1 ? groupWord() : kidName(kids[0])) + ' ' + (msgs[0] || '') + ' ' + t + '.';
  const blocks = blocksFor(date);
  const i = blocks.findIndex(b => b.id === blockId);
  if (i < 0) return msg;
  if (!had) {
    const delta = now - toMin(blocks[i].start);
    if (delta && Math.abs(delta) <= MAX_AUTO_SHIFT) { const old = toMin(blocks[i].start); const nb = moveStart(blockId, now); if (nb) msg += shiftNote(old, nb); }
  } else if (ended) {
    const entries = L.sleep.filter(x => x.blockId === blockId);
    const allAwake = state.kids.every(k => entries.some(x => x.kid === k.id && x.end));
    const next = blocks[i + 1];
    if (allAwake && next) {
      const delta = now - toMin(next.start);
      if (delta && Math.abs(delta) <= MAX_AUTO_SHIFT) { const old = toMin(next.start); const nb = moveStart(next.id, now); if (nb) msg += shiftNote(old, nb); }
    }
  }
  return msg;
}
/* Nattesøvn: når siste gutt har sovnet, starter bolken etter leggingen nå. */
function nightBlock(blocks) {
  const k = blocks.findIndex(b => b.slot === 'kveld');
  return blocks.find(b => b.slot === 'legging') || (k > 0 ? blocks[k - 1] : null);
}
function logNightNow(date, blockId, kids) {
  const L = logRec(date), now = nowMin(), t = toHM(now);
  const allBefore = state.kids.every(k => L.night[k.id] && L.night[k.id].asleep);
  kids.forEach(kid => { (L.night[kid] ??= {}).asleep = t; });
  let msg = (kids.length > 1 ? groupWord() : kidName(kids[0])) + ' sovnet ' + t + '.';
  const allNow = state.kids.every(k => L.night[k.id] && L.night[k.id].asleep);
  const blocks = blocksFor(date);
  const i = blocks.findIndex(b => b.id === blockId);
  const next = blocks[i + 1];
  if (!allBefore && allNow && next) {
    const delta = now - toMin(next.start);
    if (delta && Math.abs(delta) <= MAX_AUTO_SHIFT) {
      // Sovnet før leggebolken skulle starte: flytt leggingen tidligere også.
      if (now < toMin(blocks[i].start) + 5) moveStart(blockId, now - 15);
      const old = toMin(next.start);
      const nb = moveStart(next.id, now);
      if (nb) msg += shiftNote(old, nb);
    }
  }
  return msg;
}

/* ---------- sol ---------- */
function sunTimes(date) {
  const LOC = state && state.place;
  if (!LOC || typeof LOC.lat !== 'number') return { rise: null, set: null };
  const [y, m, d] = date.split('-').map(Number);
  const rad = Math.PI / 180;
  const jd = Date.UTC(y, m - 1, d, 12) / 86400000 + 2440587.5;
  const n = Math.round(jd - 2451545.0);
  const Js = n - LOC.lon / 360;
  const M = (357.5291 + 0.98560028 * Js) % 360;
  const C = 1.9148 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 0.0003 * Math.sin(3 * M * rad);
  const L = (M + C + 180 + 102.9372) % 360;
  const Jt = 2451545 + Js + 0.0053 * Math.sin(M * rad) - 0.0069 * Math.sin(2 * L * rad);
  const dec = Math.asin(Math.sin(L * rad) * Math.sin(23.4397 * rad));
  const cw = (Math.sin(-0.833 * rad) - Math.sin(LOC.lat * rad) * Math.sin(dec)) / (Math.cos(LOC.lat * rad) * Math.cos(dec));
  if (cw < -1 || cw > 1) return { rise: null, set: null };
  const w = Math.acos(cw) / rad;
  const loc = J => { const t = new Date((J - 2440587.5) * 86400000); return t.getHours() * 60 + t.getMinutes() + (t.getSeconds() >= 30 ? 1 : 0); };
  return { rise: loc(Jt - w / 360), set: loc(Jt + w / 360) };
}

/* ---------- visning ---------- */
const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
const ICON_X = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

function render() { renderHeader(); renderTimeline(); refreshWeather(); }

function renderHeader() {
  const today = todayISO();
  { const dd = parseISO(view); $('#date').textContent = WD[dd.getDay()] + ' ' + dd.getDate() + '. ' + MO_SHORT[dd.getMonth()]; }
  const L = state.leave, parts = [];
  const kv = (k, v) => '<span class="k">' + k + '</span>' + v;
  if (view < L.start) parts.push(kv('start om', plural(diffDays(view, L.start), 'dag', 'dager')));
  else if (view > L.end) parts.push(kv('perm', 'ferdig'));
  else parts.push(kv('dag', (diffDays(L.start, view) + 1) + '/' + (diffDays(L.start, L.end) + 1)));
  const d = state.days[view];
  if (d && (d.blocks || d.templateId)) parts.push(kv('mal', esc(state.templates[templateFor(view)].name.toLowerCase()) + '*'));
  const ps = partnerStatus(view);
  if (ps && ps.code) parts.push(kv(esc(partnerName().toLowerCase()), esc(shiftText(ps).replace(/(\d\d):00/g, '$1'))));
  const sun = sunTimes(view);
  if (sun.rise != null) parts.push(kv('sol', fmtT(toHM(sun.rise)) + '–' + fmtT(toHM(sun.set))));
  $('#sub').innerHTML = parts.map(p => '<span>' + p + '</span>').join('') +
    (view !== today ? '<button type="button" class="today" id="go-today">Til i dag</button>' : '');
  renderNowbar();
  const h = $('#top').offsetHeight;
  document.documentElement.style.setProperty('--head-h', h + 'px');
}

function bannerHTML() {
  let out = '';
  if (!store.ok) out += '<div class="banner warn">Lagring er ikke tilgjengelig i denne nettleseren. Endringer forsvinner når siden lukkes.</div>';
  const today = todayISO();
  if (view === today && syncOn()) {
    const c = sync.cfg;
    if (c.lastError) out += '<div class="banner warn"><span>Automatisk backup: ' + esc(c.lastError) + '</span><button type="button" class="btn small" data-act="sync">Prøv igjen</button></div>';
    else if (c.dirty && c.lastPush && Date.now() - Date.parse(c.lastPush) > 2 * 864e5) out += '<div class="banner"><span>Siste backup til GitHub ' + fmtStamp(c.lastPush) + '.</span><button type="button" class="btn small" data-act="sync">Lagre nå</button></div>';
  } else if (view === today) {
    const le = state.meta.lastExport;
    const since = le ? diffDays(le, today) : null;
    const need = le ? since >= 8 : diffDays(state.meta.created, today) >= 8;
    if (need) out += '<div class="banner"><span>' + (le ? 'Siste backup for ' + plural(since, 'dag', 'dager') + ' siden.' : 'Ingen backup ennå.') +
      '</span><button type="button" class="btn small" data-act="export">Eksporter</button></div>';
  }
  return out;
}

function renderTimeline() {
  if (!state) return;
  const date = view, today = todayISO(), isToday = date === today, now = nowMin();
  const blocks = blocksFor(date);
  const placed = placeTasks(date, blocks);
  const gen = genRows(date, blocks);
  const pack = packRows(date, blocks);
  Object.entries(pack).forEach(([k, v]) => { gen[k] = (gen[k] || []).concat(v); });
  const appts = apptsFor(date);
  let cur = -1;
  if (isToday) {
    blocks.forEach((b, i) => { if (toMin(b.start) <= now) cur = i; });
    if (cur >= 0 && now >= endOf(blocks, cur)) cur = -1;
  }
  const sun = sunTimes(date);
  const marks = [{ m: sun.rise, up: true }, { m: sun.set, up: false }].filter(k => k.m != null);
  const sunRow = k => '<div class="sun" aria-label="' + (k.up ? 'Soloppgang' : 'Solnedgang') + ' ' + toHM(k.m) + '"><span class="rail"></span><span class="lbl">' + (k.up ? '↑ soloppgang ' : '↓ solnedgang ') + toHM(k.m) + '</span></div>';

  let html = bannerHTML();
  const first = blocks.length ? toMin(blocks[0].start) : 24 * 60;
  marks.filter(k => k.m < first).forEach(k => html += sunRow(k));
  appts.filter(a => toMin(a.start) < first).forEach(a => html += apptHTML(a));
  blocks.forEach((b, i) => {
    const s = toMin(b.start), e = endOf(blocks, i);
    const phase = !isToday ? (date < today ? 'done-day' : 'future') : (i === cur ? 'now' : (e <= now ? 'past' : 'future'));
    html += blockHTML(b, i, blocks, placed[b.id] || [], gen[b.id] || [], phase, now, date);
    marks.filter(k => k.m >= s && k.m < e).forEach(k => html += sunRow(k));
    appts.filter(a => toMin(a.start) >= s && (toMin(a.start) < e || i === blocks.length - 1)).forEach(a => html += apptHTML(a));
  });
  if (blocks.length) marks.filter(k => k.m >= endOf(blocks, blocks.length - 1)).forEach(k => html += sunRow(k));
  if (!blocks.length) html += '<p class="hint" style="padding:24px 0">Dagen har ingen rubrikker. Legg til den første.</p>';
  html += '<div class="endrow"><button type="button" class="btn small" data-act="log">Dagslogg</button><button type="button" class="btn small" data-act="week">Ukemeny</button><button type="button" class="btn small" data-act="acts">Aktiviteter</button></div>';
  $('#timeline').innerHTML = html;
  renderNowbar();
}

function blockHTML(b, i, blocks, tasks, gen, phase, now, date) {
  const s = toMin(b.start), e = endOf(blocks, i);
  const today = todayISO();
  const rows = [
    ...b.items.map(it => ({ id: it.id, text: it.text, sub: '', rec: false })),
    ...gen,
    ...tasks.map(({ task, st }) => {
      let sub = task.rule && task.rule.kind === 'interval' ? ruleText(task.rule) : (task.rule && task.rule.kind === 'once' && st.late > 0 ? 'Husk fra ' + fmtDateShort(task.rule.start) : '');
      if (st.late > 0) sub = (sub ? sub + ', ' : '') + plural(st.late, 'dag', 'dager') + ' på etterskudd';
      return { id: task.id, text: task.text, sub, late: st.late > 0, rec: true };
    })
  ];
  const doneN = rows.filter(r => isDone(date, r.id)).length;
  const collapsed = phase === 'past' && !expanded.has(b.id);
  const last = i === blocks.length - 1;
  const title = b.title || TYPES[b.type];
  const tag = title.toLowerCase() === TYPES[b.type].toLowerCase() ? '' : TYPES[b.type].toLowerCase();
  let meta = '';
  if (collapsed) meta = rows.length ? (doneN === rows.length ? 'alt gjort' : doneN + '/' + rows.length) : '';
  else if (phase === 'now') meta = fmtDur(Math.max(1, e - now)) + ' igjen';
  else if (!last) meta = fmtDur(e - s);

  const started = date < today || (date === today && (phase === 'now' || phase === 'past'));
  let inner = '';
  if (!collapsed) {
    const dish = b.link ? dishFor(date, b.link) : null;
    if (dish) {
      inner += '<button type="button" class="dish" data-act="dish" data-meal="' + b.link + '" aria-label="' + esc(MEALS[b.link]) + ': ' + esc(dish.name) + '. Trykk for å bytte">' +
        '<span class="dh"><span class="dn">' + esc(dish.name) + '</span><span class="swap">bytt</span></span>' +
        '<span class="dm">' + esc(dishMeta(dish)) + '</span>' +
        (dish.kids ? '<span class="dk">Til guttene: ' + esc(dish.kids) + '</span>' : '') +
      '</button>';
    } else if (b.type === 'meal' && (b.boys || b.adults)) {
      inner += '<dl class="meal">' +
        (b.boys ? '<dt>Guttene</dt><dd>' + esc(b.boys) + '</dd>' : '') +
        (b.adults ? '<dt>Voksne</dt><dd>' + esc(b.adults) + '</dd>' : '') + '</dl>';
      if (b.link) inner += '<button type="button" class="btn small ghost pick" data-act="dish" data-meal="' + b.link + '">Velg rett fra banken</button>';
    }
    if (b.link === 'dinner') {
      const ph = partnerHome(date);
      const st = ph.ps && ph.ps.code ? ' (' + shiftText(ph.ps) + ')' : '';
      inner += '<div class="rowline"><button type="button" class="chip sm" data-act="wife" aria-pressed="' + ph.home + '">' + esc(partnerName()) + (ph.home ? ' spiser med' : ' spiser ikke med') + esc(st) + (ph.manual ? ' *' : '') + '</button></div>';
    }
    if (b.note) inner += '<p class="note">' + esc(b.note) + '</p>';
    if (b.type === 'awake') {
      inner += activityHTML(date, b, s, e, phase);
      const dd = state.days[date];
      const pa = dd && dd.picks && dd.picks[b.id] && state.activities.find(x => x.id === dd.picks[b.id]);
      if (pa && showOn('gear') && (pa.kind === 'ute' || pa.travel !== 'hjemme')) { const w = wxFor(date, s, e); if (w) inner += '<p class="wx"><span class="wx-k">klær</span>' + esc(clothesFor(w, true)) + '</p>'; }
    }
    if (b.type === 'prep' && i === 0 && showOn('gear')) { const w = wxFor(date, 9 * 60, 15 * 60); if (w) inner += '<p class="wx"><span class="wx-k">klær i dag</span>' + esc(clothesFor(w, true)) + '</p>'; }
    if (b.type === 'meal' && (b.boys || dish) && started) {
      const r = getLog(date).meals[b.id] || {};
      inner += '<div class="rowline"><span class="rl">spiste</span>' + state.kids.map(k =>
        '<button type="button" class="chip sm rate' + (r[k.id] ? ' r-' + r[k.id] : '') + '" data-act="rate" data-kid="' + k.id + '">' + esc(k.name) + ' ' + (r[k.id] || '–') + '</button>').join('') + '</div>';
    }
    if (b.type === 'sleep' && (date < today || (date === today && (started || s - now <= 60 || getLog(date).sleep.some(x => x.blockId === b.id))))) {
      inner += sleepLogHTML(date, b);
    }
    const nb = nightBlock(blocks);
    if (nb && nb.id === b.id && (date < today || (date === today && (started || s - now <= 60)))) inner += nightLogHTML(date, b);
    if (rows.length) {
      inner += '<ul class="checks">' + rows.map(r =>
        '<li' + (r.rec ? ' class="rec"' : r.gen ? ' class="gen"' : '') + '><label><input type="checkbox" data-done="' + esc(r.id) + '"' + (isDone(date, r.id) ? ' checked' : '') + '>' +
        '<span class="txt"><span class="main">' + esc(r.text) + '</span>' +
        (r.sub ? '<small class="' + (r.late ? 'late' : '') + '">' + esc(r.sub) + '</small>' : '') +
        '</span></label></li>').join('') + '</ul>';
    }
    if (b.slot === 'kveld') {
      if (showOn('tomorrow')) inner += tomorrowHTML(date);
      inner += '<div class="rowline"><button type="button" class="btn small" data-act="log">Åpne dagslogg</button><button type="button" class="btn small" data-act="report">Del dagsrapport</button>' +
        (!syncOn() && isoWd(date) === 7 ? '<button type="button" class="btn small" data-act="export">Eksporter backup</button>' : '') + '</div>';
    }
  }
  let prog = '';
  if (phase === 'now') {
    const frac = Math.min(1, Math.max(0, (now - s) / Math.max(1, e - s)));
    prog = '<div class="prog" aria-hidden="true"><span style="width:' + (frac * 100).toFixed(1) + '%"></span></div>';
  }
  const cls = phase === 'done-day' ? 'future' : phase;
  return '<section class="blk ty-' + b.type + ' ' + cls + '" data-id="' + esc(b.id) + '">' +
    '<div class="rail"><span class="node"></span></div>' +
    '<div class="panel">' +
      '<div class="hrow">' +
        '<button type="button" class="tbtn" data-act="time" aria-expanded="' + (shiftOpen === b.id) + '" aria-label="Flytt ' + esc(title) + ', starter ' + b.start + '">' + fmtT(b.start) + '</button>' +
        '<button type="button" class="head" data-act="' + (collapsed ? 'expand' : 'edit') + '"' + (collapsed ? ' aria-label="Vis ' + esc(title) + '"' : ' aria-label="Rediger ' + esc(title) + '"') + '>' +
          '<span class="hl"><span class="title">' + esc(title) + '</span>' +
          ((tag || meta) && !collapsed ? '<span class="sl">' + (tag ? '<span class="tag">' + tag + '</span>' : '') + (meta ? '<span class="meta">' + meta + '</span>' : '') + '</span>' : '') +
          '</span>' +
          (collapsed ? '<span class="meta">' + meta + '</span>' : '<span class="edit" aria-hidden="true">' + ICON_EDIT + '</span>') +
        '</button>' +
      '</div>' + (shiftOpen === b.id ? shiftBarHTML(date) : '') + inner + prog +
    '</div></section>';
}

function nightLogHTML(date, b) {
  const isToday = date === todayISO();
  const N = getLog(date).night;
  const rowsH = state.kids.map(k => {
    const a = N[k.id] && N[k.id].asleep;
    return '<div class="lg-row"><span class="kn">' + esc(k.name) + '</span>' +
      '<button type="button" class="lg-t" data-act="log">' + (a ? 'sovnet ' + a : 'ikke logget') + '</button>' +
      (isToday && !a ? '<button type="button" class="btn small" data-act="night-now" data-kid="' + k.id + '">Sovnet</button>' : '') + '</div>';
  }).join('');
  const none = state.kids.every(k => !(N[k.id] && N[k.id].asleep));
  return '<div class="log night"><span class="lg-h">nattesøvn</span>' + rowsH +
    (isToday && none && state.kids.length > 1 ? '<button type="button" class="btn small wide" data-act="night-now" data-kid="all">' + groupWord() + ' sovnet nå</button>' : '') + '</div>';
}

function sleepLogHTML(date, b) {
  const isToday = date === todayISO();
  const st = k => { const e = napEntry(date, k, b.id); return !e ? 'none' : (!e.end ? 'open' : 'done'); };
  const rowsH = state.kids.map(k => {
    const e = napEntry(date, k.id, b.id), s = st(k.id);
    const times = e ? e.start + '–' + (e.end || '…') + (e.end ? ' (' + fmtDurShort(toMin(e.end) - toMin(e.start)) + ')' : '') : 'ikke logget';
    let act = '';
    if (isToday && s === 'none') act = '<button type="button" class="btn small" data-act="sleep-now" data-kid="' + k.id + '">Sovnet</button>';
    else if (isToday && s === 'open') act = '<button type="button" class="btn small primary" data-act="sleep-now" data-kid="' + k.id + '">Våknet</button>';
    return '<div class="lg-row"><span class="kn">' + esc(k.name) + '</span>' +
      '<button type="button" class="lg-t" data-act="sleep-edit" data-kid="' + k.id + '">' + times + '</button>' + act + '</div>';
  }).join('');
  const states = state.kids.map(k => st(k.id));
  let both = '';
  if (isToday && states.every(x => x === states[0]) && states[0] !== 'done' && state.kids.length > 1) {
    both = '<button type="button" class="btn small wide' + (states[0] === 'open' ? ' primary' : '') + '" data-act="sleep-now" data-kid="all">' + groupWord() + ' ' + (states[0] === 'open' ? 'våknet' : 'sovnet') + ' nå</button>';
  }
  return '<div class="log"><span class="lg-h">søvnlogg</span>' + rowsH + both + '</div>';
}

function shiftBarHTML(date) {
  const isToday = date === todayISO();
  return '<div class="shiftbar"><span class="sb-l">Flytt denne og resten av ' + (isToday ? 'i dag' : 'dagen') + ' (min)</span>' +
    '<div class="sb-btns">' + [-30, -15, 15, 30].map(d => '<button type="button" class="btn small" data-qshift="' + d + '">' + (d > 0 ? '+' : '−') + Math.abs(d) + '</button>').join('') + '</div>' +
    (isToday ? '<button type="button" class="btn small primary" data-qshift="now">Starter nå</button>' : '') +
    '</div>';
}

function scrollToNow() {
  const el = document.querySelector('.blk.now') || [...document.querySelectorAll('.blk.future')][0];
  if (el && view === todayISO()) el.scrollIntoView({ block: 'start' });
  else window.scrollTo(0, 0);
}

function go(n, date) {
  view = date || (n === 0 ? todayISO() : addDays(view, n));
  expanded.clear();
  shiftOpen = null;
  render();
  scrollToNow();
}

function toggleDone(date, id, on) {
  const d = dayRec(date);
  d.done = d.done || {};
  if (on) d.done[id] = true; else delete d.done[id];
  persist();
  renderTimeline();
}

/* ---------- ark (bottom sheet) ---------- */
function openSheet(html, mount) {
  const root = $('#sheet-root');
  const wasOpen = root.classList.contains('open');
  root.innerHTML = '<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true">' + html + '</div>';
  root.hidden = false;
  document.body.classList.add('locked');
  if (wasOpen) root.classList.add('open');
  else requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('open')));
  const sheet = root.querySelector('.sheet');
  root.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeSheet));
  const back = sheet.querySelector('[data-back]');
  if (back) back.addEventListener('click', openMenu);
  if (mount) mount(sheet);
}
function closeSheet() {
  const root = $('#sheet-root');
  root.classList.remove('open');
  document.body.classList.remove('locked');
  reopen = null;
  setTimeout(() => { if (!root.classList.contains('open')) { root.hidden = true; root.innerHTML = ''; } }, 260);
}
const sheetOpen = () => $('#sheet-root').classList.contains('open');
const headHTML = (title, back) => '<div class="sh-head"><h2>' + title + '</h2>' +

function readBlock(sheet, b) {
  const q = s => sheet.querySelector(s);
  b.type = q('#f-type').value;
  b.title = q('#f-title').value.trim() || TYPES[b.type];
  b.start = q('#f-start').value || b.start;
  b.boys = q('#f-boys').value.trim();
  b.adults = q('#f-adults').value.trim();
  b.link = b.type === 'meal' ? q('#f-link').value : '';
  b.note = q('#f-note').value.trim();
  b.items = [...sheet.querySelectorAll('#f-items .item')]
    .map(r => ({ id: r.dataset.iid || 'i-' + uid(), text: r.querySelector('input').value.trim() }))
    .filter(x => x.text);
  if (!b.slot) b.slot = b.id;
}
function upsert(arr, b) {
  const i = arr.findIndex(x => x.id === b.id);
  if (i >= 0) arr[i] = clone(b); else arr.push(clone(b));
  sortBlocks(arr);
}
function saveBlock(b, scope, tplId) {
  if (scope === 'tpl') { upsert(state.templates[tplId].blocks, b); return; }
  if (scope === 'day') { upsert(ensureDayBlocks(view), b); return; }
  upsert(state.templates[templateFor(view)].blocks, b);
  const d = state.days[view];
  if (d && d.blocks) upsert(d.blocks, b);
}
function deleteBlock(id, scope, tplId) {
  const rm = arr => { const i = arr.findIndex(x => x.id === id); if (i >= 0) arr.splice(i, 1); };
  if (scope === 'tpl') { rm(state.templates[tplId].blocks); return; }
  if (scope === 'day') { rm(ensureDayBlocks(view)); return; }
  rm(state.templates[templateFor(view)].blocks);
  const d = state.days[view];
  if (d && d.blocks) rm(d.blocks);
}
function shiftFrom(id, delta) {
  const arr = ensureDayBlocks(view);
  sortBlocks(arr);
  const i = arr.findIndex(x => x.id === id);
  if (i < 0) return;
  for (let k = i; k < arr.length; k++) arr[k].start = toHM(toMin(arr[k].start) + delta);
  sortBlocks(arr);
}

        navRow('acts', 'Aktivitetsbibliotek', plural(state.activities.length, 'aktivitet', 'aktiviteter') + (state.place ? ', vær for ' + esc(state.place.name) : ', velg sted i Profil for vær')) +
      '</div></section>' +
      '<section class="grp"><h3>Logg</h3><div class="list">' +

      '</div></section>' +

      sheet.addEventListener('click', e => {
        const nav = e.target.closest('[data-nav]');
        const m = e.target.closest('[data-m]');
        if (nav) {
          const n = nav.dataset.nav;
          ({ week: openWeekSheet, bank: openBankSheet, log: () => openLogSheet(view), history: openHistorySheet, tasks: openTasksSheet, templates: openTemplatesSheet, backup: openSyncSheet, profile: () => openProfileSheet(false), partner: openPartnerSheet, acts: openActivitiesSheet })[n]();
          return;
        }
        if (!m) return;
        if (m.dataset.m === 'new') openBlockSheet(null);
        else if (m.dataset.m === 'add') openAddSheet();
        else if (m.dataset.m === 'saveday') openSaveDaySheet();
        else if (m.dataset.m === 'undo') undoLast();
        else if (m.dataset.m === 'reset') { closeSheet(); mutate('Dagen følger malen igjen', () => { delete state.days[view].blocks; }); }
      });
      q('#m-daytpl').addEventListener('change', e => {
        const v = e.target.value;

          const d = dayRec(view);
          if (v) d.templateId = v; else delete d.templateId;
          delete d.blocks;
        });
        openMenu();
      });
    });
}

/* ---------- ukemeny ---------- */
function openWeekSheet(ws) {
  ws = ws || weekStart(view);
  const days = [...Array(7)].map((_, i) => addDays(ws, i));
  days.forEach(d => ensureWeek(d));
  reopen = () => openWeekSheet(ws);
  const today = todayISO();
  const tomorrow = addDays(today, 1);
  openSheet(
    headHTML('Ukemeny', true) +
    '<div class="sh-body">' +
      '<section class="grp"><h3>Uke fra ' + fmtDateShort(ws) + '</h3>' +
        '<div class="row2"><button type="button" class="btn small" data-wk="-7">Forrige uke</button><button type="button" class="btn small" data-wk="7">Neste uke</button></div>' +
        '<div class="list">' + days.map(d => {
          const din = dishFor(d, 'dinner'), lun = dishFor(d, 'lunch');
          const m = state.menu[d] || {};
          const ph = partnerHome(d);
          const pinfo = partnerOn() ? partnerName() + ': ' + (ph.ps && ph.ps.code ? shiftText(ph.ps) : 'ingen vakt registrert') + (ph.home ? ', spiser med' : ', spiser ikke med') : (ph.home ? partnerName() + ' spiser med' : '');
          return '<button type="button" class="row' + (d === today ? ' cur' : '') + '" data-day="' + d + '"><span class="grow">' +
            '<span class="wd">' + fmtDateTiny(d) + '</span> ' + (din ? esc(din.name) : '<span class="m" style="display:inline">ingen middag valgt</span>') +
            '<span class="m">' + (din ? esc(dishMeta(din)) : '') + (m.dinner && m.dinner.manual ? ', valgt selv' : '') + '</span>' + (pinfo ? '<span class="m">' + esc(pinfo.trim()) + '</span>' : '') +
            (lun ? '<span class="m">lunsj: ' + esc(lun.name) + '</span>' : '') +
          '</span><span class="r">›</span></button>';
        }).join('') + '</div>' +
        '<p class="hint">Trykk på en dag for å bytte rett. Faste retter står på sine dager, fisk spres utover uka, og ellers kommer retten som er spist for lengst siden.</p>' +
      '</section>' +
      '<section class="grp"><h3>Lag menyen på nytt</h3>' +
        '<p class="hint">Gjelder dager fra og med i morgen (' + fmtDateShort(tomorrow) + '). Retter du har valgt selv, beholdes.</p>' +
        '<button type="button" class="btn wide" data-regen>Lag ny meny fra i morgen</button>' +
      '</section>' +
    '</div>',
    sheet => {
      sheet.querySelectorAll('[data-wk]').forEach(b => b.addEventListener('click', () => openWeekSheet(addDays(ws, Number(b.dataset.wk)))));
      sheet.querySelectorAll('[data-day]').forEach(b => b.addEventListener('click', () => openSwapSheet(b.dataset.day, 'dinner', () => openWeekSheet(ws))));
      sheet.querySelector('[data-regen]').addEventListener('click', () => {
        mutate('Ny meny fra ' + fmtDateShort(tomorrow), () => regenerateFrom(tomorrow));
        openWeekSheet(ws);
      });
    });
}

/* ---------- bytt rett ---------- */
function openSwapSheet(date, meal, back) {
  const cur = dishFor(date, meal);
  const m = state.menu[date] && state.menu[date][meal];
  const list = state.dishes.filter(x => x.meal === meal)
    .map(x => ({ x, l: lastServed(x.id, date) }))
    .sort((a, b) => (a.l || '').localeCompare(b.l || '') || a.x.name.localeCompare(b.x.name));
  const afterSave = () => { if (back) back(); else closeSheet(); };
  reopen = null;
  openSheet(
    '<div class="sh-head"><h2>' + MEALS[meal] + ' ' + fmtDateTiny(date) + '</h2>' +
      (back ? '<button type="button" class="btn ghost" data-goback>Tilbake</button>' : '<button type="button" class="btn ghost" data-close>Lukk</button>') + '</div>' +
    '<div class="sh-body">' +
      (cur ? '<section class="grp"><h3>Valgt nå</h3>' +
        '<div class="dcard"><strong>' + esc(cur.name) + '</strong><span class="m">' + esc(dishMeta(cur)) + '</span>' +
          (cur.kids ? '<span>Til guttene: ' + esc(cur.kids) + '</span>' : '') +
          (cur.prep ? '<span class="m">Forberedelse: ' + esc(cur.prep) + '</span>' : '') +
          (cur.dayBefore ? '<span class="m">Dagen før: ' + esc(cur.dayBefore) + '</span>' : '') +
        '</div>' +
        '<div class="row2"><button type="button" class="btn small" data-edit-dish="' + cur.id + '">Rediger retten</button>' +
        (m && m.manual ? '<button type="button" class="btn small" data-auto>Tilbake til auto</button>' : '<button type="button" class="btn small" data-none>Ingen rett</button>') + '</div>' +
      '</section>' : (m && m.manual ? '<section class="grp"><p class="hint">Ingen rett valgt for dagen.</p><button type="button" class="btn small wide" data-auto>Tilbake til automatisk meny</button></section>' : '')) +
      '<section class="grp"><h3>Velg en annen</h3><div class="list">' +
        list.map(({ x, l }) => '<button type="button" class="row' + (cur && cur.id === x.id ? ' cur' : '') + '" data-pick="' + x.id + '"><span class="grow">' + esc(x.name) +
          '<span class="m">' + esc(dishMeta(x)) + '</span></span><span class="r">' + (l ? diffDays(l, date) + ' d siden' : 'ny') + '</span></button>').join('') +
      '</div><p class="hint">Sortert etter hvor lenge siden retten sto på menyen.</p></section>' +
    '</div>',
    sheet => {
      const gb = sheet.querySelector('[data-goback]');
      if (gb) gb.addEventListener('click', back);
      sheet.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {
        const d = dishById(b.dataset.pick);
        mutate(MEALS[meal] + ' ' + fmtDateTiny(date) + ': ' + d.name, () => setMenu(date, meal, d.id, true));
        afterSave();
      }));
      const none = sheet.querySelector('[data-none]');
      if (none) none.addEventListener('click', () => { mutate('Ingen ' + MEALS[meal].toLowerCase() + ' valgt', () => setMenu(date, meal, null, true)); afterSave(); });
      const auto = sheet.querySelector('[data-auto]');
      if (auto) auto.addEventListener('click', () => {
        mutate('Automatisk meny for dagen', () => { delete state.menu[date][meal]; generateWeek(weekStart(date), date); });
        afterSave();
      });
      const ed = sheet.querySelector('[data-edit-dish]');
      if (ed) ed.addEventListener('click', () => openDishSheet(ed.dataset.editDish, () => openSwapSheet(date, meal, back)));
    });
}

    '</form>' +
    '<div class="sh-foot"><button type="button" class="btn primary grow" data-save>Lagre rett</button></div>',
    sheet => {
      const q = s => sheet.querySelector(s);
      q('[data-goback]').addEventListener('click', back);
      q('#df').addEventListener('submit', e => e.preventDefault());
      const del = q('[data-del]');
      if (del) {
        del.addEventListener('click', () => { q('#d-confirm').hidden = false; del.hidden = true; });
        q('[data-del-yes]').addEventListener('click', () => {
          mutate('Rett slettet', () => {
            state.dishes = state.dishes.filter(x => x.id !== d.id);
            for (const m of Object.values(state.menu)) for (const k of Object.keys(m)) if (m[k] && m[k].dish === d.id) delete m[k];
          });
          openBankSheet();
        });
      }
      q('[data-save]').addEventListener('click', () => {
        const name = q('#d-name').value.trim();
        if (!name) { q('#d-name').focus(); return; }
        Object.assign(d, {
          name, meal: q('#d-meal').value, cat: q('#d-cat').value,
          minutes: Math.max(1, parseInt(q('#d-min').value, 10) || 30),
          weekday: Number(q('#d-wd').value),
          kids: q('#d-kids').value.trim(), prep: q('#d-prep').value.trim(), dayBefore: q('#d-before').value.trim()
        });
        mutate('Rett lagret', () => {
          const i = state.dishes.findIndex(x => x.id === d.id);
          if (i >= 0) state.dishes[i] = d; else state.dishes.push(d);
        });
        back();
      });
      if (isNew) setTimeout(() => q('#d-name').focus(), 300);
    });
