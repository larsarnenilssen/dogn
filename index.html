/* ---------- dagslogg ---------- */
function openLogSheet(date) {
  reopen = () => openLogSheet(date);
  const L = getLog(date);
  const blocks = blocksFor(date);
  const mealBlocks = blocks.filter(b => b.type === 'meal' && (b.boys || b.link));
  const sleepFor = kid => L.sleep.filter(e => e.kid === kid).sort((a, b) => a.start.localeCompare(b.start));
  const bName = id => { const b = blocks.find(x => x.id === id); return b ? b.title + ' ' + b.start : 'lur'; };
  openSheet(
    '<div class="sh-head"><h2>Dagslogg ' + fmtDateTiny(date) + '</h2><button type="button" class="btn ghost" data-close>Lukk</button></div>' +
    '<div class="sh-body">' +
      '<section class="grp"><h3>Lurer</h3>' +
        state.kids.map(k => {
          const list = sleepFor(k.id);
          return '<div class="lg-sum"><strong>' + esc(k.name) + '</strong><span class="m">' + (list.length ? (napTotal(date, k.id) ? 'totalt ' + fmtDurShort(napTotal(date, k.id)) : 'pågår') : 'ingen lurer logget') + '</span></div>' +
            (list.length ? '<div class="list">' + list.map(e => '<button type="button" class="row" data-nap="' + e.id + '"><span class="grow">' + e.start + '–' + (e.end || '…') +
              '<span class="m">' + esc(bName(e.blockId)) + '</span></span><span class="r">' + (e.end ? fmtDurShort(toMin(e.end) - toMin(e.start)) : '') + '</span></button>').join('') + '</div>' : '');
        }).join('') +
        '<p class="hint">Lurer logges med knappene i søvnbolkene. Trykk på en lur for å endre tidene.</p>' +
      '</section>' +
      '<section class="grp"><h3>Natt</h3>' +
        state.kids.map(k => { const n = L.night[k.id] || {}; return '<div class="field"><span class="lbl">' + esc(k.name) + '</span><div class="row2">' +
          '<div class="field"><label for="n-a-' + k.id + '">Sovnet i kveld</label><input type="time" id="n-a-' + k.id + '" data-night="' + k.id + '" data-f="asleep" value="' + (n.asleep || '') + '"></div>' +
          '<div class="field"><label for="n-w-' + k.id + '">Våknet i morgen</label><input type="time" id="n-w-' + k.id + '" data-night="' + k.id + '" data-f="wake" value="' + (n.wake || '') + '"></div>' +
        '</div></div>'; }).join('') +
      '</section>' +
      '<section class="grp"><h3>Måltider</h3>' +
        (mealBlocks.length ? '<div class="list">' + mealBlocks.map(b => { const r = L.meals[b.id] || {};
          return '<div><span class="grow">' + esc(b.title) + '<span class="m">' + b.start + '</span></span><span class="rates">' +
            state.kids.map(k => '<button type="button" class="chip sm rate' + (r[k.id] ? ' r-' + r[k.id] : '') + '" data-lrate="' + b.id + '" data-kid="' + k.id + '">' + esc(k.name.charAt(0)) + ' ' + (r[k.id] || '–') + '</button>').join('') +
          '</span></div>'; }).join('') + '</div>' : '<p class="hint">Ingen måltider i dagens plan.</p>') +
        '<p class="hint">Trykk for å veksle mellom godt, middels og lite.</p>' +
      '</section>' +
      '<section class="grp"><h3>Notat</h3><label for="l-note" class="vh">Notat for dagen</label>' +
        '<textarea id="l-note" rows="4" placeholder="Hva gikk bra, hva bør endres?">' + esc(L.note) + '</textarea></section>' +
      '<button type="button" class="btn wide" data-report>Del dagsrapport</button>' +
    '</div>',
    sheet => {
      sheet.querySelectorAll('[data-night]').forEach(inp => inp.addEventListener('change', () => {
        const Lr = logRec(date);
        (Lr.night[inp.dataset.night] ??= {})[inp.dataset.f] = inp.value;
        persist();
      }));
      sheet.querySelectorAll('[data-lrate]').forEach(btn => btn.addEventListener('click', () => {
        cycleRate(date, btn.dataset.lrate, btn.dataset.kid);
        openLogSheet(date);
      }));
      sheet.querySelectorAll('[data-nap]').forEach(btn => btn.addEventListener('click', () => {
        const e = getLog(date).sleep.find(x => x.id === btn.dataset.nap);
        if (e) openNapSheet(date, e.blockId, e.kid, () => openLogSheet(date));
      }));
      sheet.querySelector('[data-report]').addEventListener('click', () => shareReport(date));
      const note = sheet.querySelector('#l-note');
      note.addEventListener('input', () => { logRec(date).note = note.value; persist(); });
    });
}
function cycleRate(date, blockId, kid) {
  const L = logRec(date);
  const r = (L.meals[blockId] ??= {});
  const next = RATES[(RATES.indexOf(r[kid] || '') + 1) % RATES.length];
  if (next) r[kid] = next; else delete r[kid];
  persist();
  renderTimeline();
}

function openNapSheet(date, blockId, kid, back) {
  const e = napEntry(date, kid, blockId) || { start: '', end: '' };
  const b = blocksFor(date).find(x => x.id === blockId);
  reopen = null;
  openSheet(
    '<div class="sh-head"><h2>' + esc(kidName(kid)) + ', ' + esc(b ? b.title + ' ' + b.start : 'lur') + '</h2>' +
      (back ? '<button type="button" class="btn ghost" data-goback>Tilbake</button>' : '<button type="button" class="btn ghost" data-close>Lukk</button>') + '</div>' +
    '<form class="sh-body" id="nf" novalidate>' +
      '<section class="grp"><h3>Tider</h3><div class="row2">' +
        '<div class="field"><label for="nap-s">Sovnet</label><input type="time" id="nap-s" value="' + e.start + '"></div>' +
        '<div class="field"><label for="nap-e">Våknet</label><input type="time" id="nap-e" value="' + e.end + '"></div>' +
      '</div></section>' +
      (e.id ? '<section class="grp quiet"><button type="button" class="btn link" data-del>Slett luren fra loggen</button></section>' : '') +
    '</form>' +
    '<div class="sh-foot"><button type="button" class="btn primary grow" data-save>Lagre</button></div>',
    sheet => {
      const q = s => sheet.querySelector(s);
      const done = () => { if (back) back(); else closeSheet(); };
      const gb = q('[data-goback]'); if (gb) gb.addEventListener('click', back);
      q('#nf').addEventListener('submit', ev => ev.preventDefault());
      q('[data-save]').addEventListener('click', () => {
        const s = q('#nap-s').value, en = q('#nap-e').value;
        if (!s) { q('#nap-s').focus(); return; }
        mutate('Lur lagret', () => {
          const L = logRec(date);
          let x = L.sleep.find(y => y.kid === kid && y.blockId === blockId);
          if (!x) { x = { id: 's-' + uid(), kid, blockId }; L.sleep.push(x); }
          x.start = s; x.end = en;
        });
        done();
      });
      const del = q('[data-del]');
      if (del) del.addEventListener('click', () => {
        mutate('Lur slettet fra loggen', () => { const L = logRec(date); L.sleep = L.sleep.filter(y => !(y.kid === kid && y.blockId === blockId)); });
        done();
      });
    });
}

/* ---------- oversikt ---------- */

function openTasksSheet() {
  reopen = openTasksSheet;
  const slots = allSlots();
  const slotLabel = t => { const s = slots.find(x => x.slot === t.slot); return s ? s.label : TYPES[t.type] || ''; };
  const pending = state.tasks.filter(t => t.rule && t.rule.kind === 'once' && !completions(t.id).length);
  const recurring = state.tasks.filter(t => !t.rule || t.rule.kind !== 'once');
  openSheet(
    headHTML('Gjøremål', true) +
    '<div class="sh-body">' +
      (pending.length ? '<section class="grp"><h3>Huskeliste</h3><div class="list">' + pending.map(t =>
        '<button type="button" class="row" data-task="' + esc(t.id) + '"><span class="grow">' + esc(t.text) + '<span class="m">' + esc(ruleText(t.rule)) + ', ' + esc(slotLabel(t)) + '</span></span><span class="r">›</span></button>').join('') + '</div></section>' : '') +
      '<section class="grp"><h3>Går igjen</h3>' +
      '<div class="list">' + (recurring.length ? recurring.map(t =>
        '<button type="button" class="row" data-task="' + esc(t.id) + '"><span class="grow">' + esc(t.text) + '<span class="m">' + esc(ruleText(t.rule)) + ', ' + esc(slotLabel(t)) + '</span></span><span class="r">›</span></button>').join('')
        : '<div><span class="hint">Ingen ennå.</span></div>') +
      '</div><button type="button" class="btn wide" data-new-task>Nytt gjøremål</button>' +
    '</section><button type="button" class="btn wide" data-add-husk>Husk noe</button></div>',
    sheet => {
      sheet.querySelectorAll('[data-task]').forEach(b => b.addEventListener('click', () => openTaskSheet(b.dataset.task)));
      sheet.querySelector('[data-new-task]').addEventListener('click', () => openTaskSheet(null));
      sheet.querySelector('[data-add-husk]').addEventListener('click', () => openAddSheet('husk'));
    });
}

function openTaskSheet(id) {
  const isNew = !id;

    ? { id: 't-' + uid(), text: '', slot: 'lur1', type: 'sleep', rule: { kind: 'interval', every: 7, start: todayISO() > state.leave.start ? todayISO() : state.leave.start, days: [] } }
    : state.tasks.find(t => t.id === id);
  if (!src) return;
  const t = clone(src);
  t.rule.days = t.rule.days || [];
  t.rule.every = t.rule.every || 7;
  t.rule.start = t.rule.start || todayISO();
  const slots = allSlots();
  const prev = completions(t.id).pop();
  reopen = null;
  openSheet(
    '<div class="sh-head"><h2>' + (isNew ? 'Nytt gjøremål' : 'Rediger gjøremål') + '</h2><button type="button" class="btn ghost" data-goback>Tilbake</button></div>' +
    '<form class="sh-body" id="tf" novalidate>' +
      '<section class="grp"><h3>Gjøremål</h3>' +
        '<label for="t-text" class="vh">Gjøremål</label><input id="t-text" type="text" value="' + esc(t.text) + '" autocomplete="off" placeholder="For eksempel Skifte sengetøy">' +
      '</section>' +
      '<section class="grp"><h3>Hvor ofte</h3>' +
        '<label for="t-kind" class="vh">Hvor ofte</label><select id="t-kind">' +
          [['once', 'Én gang'], ['daily', 'Hver dag'], ['interval', 'Med fast mellomrom'], ['weekdays', 'Faste ukedager']].map(([k, v]) => '<option value="' + k + '"' + (t.rule.kind === k ? ' selected' : '') + '>' + v + '</option>').join('') +
        '</select>' +
        '<div class="field" id="t-every-f"><label for="t-every">Antall dager mellom hver gang</label><input id="t-every" type="number" inputmode="numeric" min="1" max="60" value="' + t.rule.every + '">' +
          '<p class="hint">Telleren starter på nytt når du krysser av. Blir det ikke gjort, står det igjen til neste dag.' + (prev ? ' Sist gjort ' + fmtDateShort(prev) + '.' : '') + '</p></div>' +
        '<div class="field" id="t-days-f"><span class="lbl">Ukedager</span><div class="chips">' +
          WD_SHORT.map((w, i) => '<button type="button" class="chip" data-wd="' + (i + 1) + '" aria-pressed="' + t.rule.days.includes(i + 1) + '">' + w + '</button>').join('') +
        '</div></div>' +
        '<div class="field"><label for="t-start" id="t-start-l">Første gang</label><input id="t-start" type="date" value="' + t.rule.start + '"></div>' +
      '</section>' +
      '<section class="grp"><h3>Vises i</h3>' +
        '<label for="t-slot" class="vh">Vises i</label><select id="t-slot">' +
          slots.map(s => '<option value="' + esc(s.slot) + '"' + (s.slot === t.slot ? ' selected' : '') + '>' + esc(s.label) + '</option>').join('') +
        '</select>' +
        '<p class="hint">Finnes ikke rubrikken i malen som brukes, vises gjøremålet i første rubrikk av samme type.</p>' +
      '</section>' +
      (isNew ? '' : '<section class="grp quiet"><button type="button" class="btn link" data-del>Slett gjøremål</button><div class="confirm" id="t-confirm" hidden><p class="hint">Slette «' + esc(t.text) + '»? Tidligere avkrysninger forsvinner fra oversikten.</p><div class="btnrow"><button type="button" class="btn small danger" data-del-yes>Slett</button></div></div></section>') +
    '</form>' +
    '<div class="sh-foot"><button type="button" class="btn primary grow" data-save>Lagre gjøremål</button></div>',
    sheet => {
      const q = s => sheet.querySelector(s);
      const sync = () => {
        const k = q('#t-kind').value;
        q('#t-every-f').hidden = k !== 'interval';
        q('#t-days-f').hidden = k !== 'weekdays';
        q('#t-start-l').textContent = k === 'interval' ? 'Første gang' : k === 'once' ? 'Dato' : 'Gjelder fra';
      };
      sync();
      q('#t-kind').addEventListener('change', sync);
      q('[data-goback]').addEventListener('click', openTasksSheet);
      q('#tf').addEventListener('submit', e => e.preventDefault());
      sheet.querySelectorAll('[data-wd]').forEach(c => c.addEventListener('click', () => c.setAttribute('aria-pressed', c.getAttribute('aria-pressed') !== 'true')));
      const del = q('[data-del]');
      if (del) {
        del.addEventListener('click', () => { q('#t-confirm').hidden = false; del.hidden = true; });
        q('[data-del-yes]').addEventListener('click', () => {
          mutate('Gjøremål slettet', () => { state.tasks = state.tasks.filter(x => x.id !== t.id); });
          openTasksSheet();
        });
      }
      q('[data-save]').addEventListener('click', () => {
        const text = q('#t-text').value.trim();
        if (!text) { q('#t-text').focus(); return; }
        t.text = text;
        t.rule = {
          kind: q('#t-kind').value,
          every: Math.max(1, Math.min(365, parseInt(q('#t-every').value, 10) || 7)),
          start: q('#t-start').value || todayISO(),
          days: [...sheet.querySelectorAll('[data-wd][aria-pressed="true"]')].map(c => Number(c.dataset.wd))
        };
        t.slot = q('#t-slot').value;
        const sl = slots.find(s => s.slot === t.slot);
        t.type = sl ? sl.type : t.type;
        mutate('Gjøremål lagret', () => {
          const i = state.tasks.findIndex(x => x.id === t.id);
          if (i >= 0) state.tasks[i] = t; else state.tasks.push(t);
        });
        openTasksSheet();
      });
      if (isNew) setTimeout(() => q('#t-text').focus(), 300);
    });
}

function tplUse(id) {
  const sch = state.schedule.filter(s => s.templateId === id).map(s => s.from).sort();
  const days = Object.values(state.days).filter(d => d.templateId === id).length;
  return { sch, days };
}
function makeTemplate(name, blocks) {
  const id = 'tpl-' + uid();
  const used = new Set();
  const t = { id, name, blocks: blocks.map(b => {
    const nb = clone(b);
    nb.slot = b.slot || b.id;
    nb.id = id + '.' + nb.slot;
    if (used.has(nb.id)) nb.id += '-' + uid();
    used.add(nb.id);
    nb.items = (nb.items || []).map(it => ({ id: nb.id + '.' + uid(), text: it.text }));
    return nb;
  }) };
  sortBlocks(t.blocks);
  state.templates[id] = t;
  return t;
}
function scheduleFrom(from, templateId) {
  state.schedule = state.schedule.filter(s => s.from !== from);
  state.schedule.push({ from, templateId });
  state.schedule.sort((a, b) => a.from.localeCompare(b.from));
}
const tplMeta = t => {
  const u = tplUse(t.id);
  return plural(t.blocks.length, 'bolk', 'bolker') + (u.sch.length ? ', i planen fra ' + u.sch.map(fmtDateShort).join(' og ') : ', ikke i planen') + (u.days ? ', ' + plural(u.days, 'enkeltdag', 'enkeltdager') : '');
};

function openTemplateEditor(id) {
  const t = state.templates[id];
  if (!t) { openTemplatesSheet(); return; }
  reopen = () => openTemplateEditor(id);
  const u = tplUse(id);
  const only = Object.keys(state.templates).length === 1;
  const canDelete = !only && !u.sch.length && !u.days;
  const blocks = sortBlocks(t.blocks);
  openSheet(
    '<div class="sh-head"><h2>' + esc(t.name) + '</h2><button type="button" class="btn ghost" data-goback>Tilbake</button></div>' +
    '<div class="sh-body">' +
      '<section class="grp"><h3>Navn</h3><label for="te-name" class="vh">Navn</label><input id="te-name" type="text" value="' + esc(t.name) + '" autocomplete="off"></section>' +
      '<section class="grp"><h3>Bolker</h3>' +
        (blocks.length ? '<div class="list">' + blocks.map(b => '<button type="button" class="row tb-' + b.type + '" data-blk="' + esc(b.id) + '"><span class="grow"><span class="wd">' + b.start + '</span> ' + esc(b.title) +
          '<span class="m">' + esc(TYPES[b.type].toLowerCase()) + (b.items.length ? ', ' + plural(b.items.length, 'punkt', 'punkter') : '') + (b.link ? ', rett fra banken' : '') + '</span></span><span class="r">›</span></button>').join('') + '</div>'
          : '<p class="hint">Malen er tom. Legg til den første bolken.</p>') +
        '<button type="button" class="btn wide" data-new-blk>Ny bolk</button>' +
        '<p class="hint">Endringer her lagres rett i malen og gjelder alle dager som bruker den.</p>' +
      '</section>' +
      '<section class="grp"><h3>Bruk malen</h3>' +
        '<p class="hint">' + (u.sch.length ? 'I planen fra ' + u.sch.map(fmtDateShort).join(' og ') + '.' : 'Ikke i planen ennå.') + '</p>' +
        '<div class="field"><label for="te-from">Fra dato</label><input id="te-from" type="date" value="' + addDays(todayISO(), 1) + '"></div>' +
        '<button type="button" class="btn primary wide" data-use>Bruk fra denne datoen</button>' +
        '<button type="button" class="btn wide" data-try>Se malen på en dag</button>' +
        '<p class="hint">«Se malen på en dag» viser malen i tidslinjen for datoen over, bare den dagen. Du kan angre med Meny › Mal for dagen.</p>' +
      '</section>' +
      '<section class="grp quiet">' +
        '<button type="button" class="btn small" data-copy>Kopier malen</button>' +
        (canDelete ? '<button type="button" class="btn link" data-del>Slett malen</button>' : '<p class="hint">' + (only ? 'Den eneste malen kan ikke slettes.' : 'Malen er i bruk og kan ikke slettes. Fjern den fra planen først.') + '</p>') +
      '</section>' +
    '</div>',
    sheet => {
      const q = s => sheet.querySelector(s);
      q('[data-goback]').addEventListener('click', openTemplatesSheet);
      q('#te-name').addEventListener('change', e => { const v = e.target.value.trim(); if (v) { mutate('Navn lagret', () => { state.templates[id].name = v; }); openTemplateEditor(id); } });
      sheet.querySelectorAll('[data-blk]').forEach(b => b.addEventListener('click', () => openBlockSheet(b.dataset.blk, id)));
      q('[data-new-blk]').addEventListener('click', () => openBlockSheet(null, id));
      q('[data-use]').addEventListener('click', () => {
        const from = q('#te-from').value;
        if (!from) return;
        mutate(t.name + ' fra ' + fmtDateShort(from), () => scheduleFrom(from, id));
        openTemplateEditor(id);
      });
      q('[data-try]').addEventListener('click', () => {
        const d = q('#te-from').value || todayISO();
        closeSheet();
        mutate(t.name + ' ' + fmtDateTiny(d), () => { const r = dayRec(d); r.templateId = id; delete r.blocks; });
        go(0, d);
      });
      q('[data-copy]').addEventListener('click', () => {
        let c;
        mutate('Kopi laget', () => { c = makeTemplate('Kopi av ' + t.name, t.blocks); });
        openTemplateEditor(c.id);
      });
      const del = q('[data-del]');
      if (del) del.addEventListener('click', () => { mutate('Mal slettet', () => { delete state.templates[id]; }); openTemplatesSheet(); });
    });
}

/* Lagre en justert dag som mal: endre malen dagen bruker, eller lag en ny mal fra en dato. */
function openSaveDaySheet() {
  const date = view;
  const curId = templateFor(date);
  const cur = state.templates[curId];
  const blocks = blocksFor(date);
  const defFrom = date >= todayISO() ? (date === todayISO() ? addDays(date, 1) : date) : addDays(todayISO(), 1);
  reopen = null;
  openSheet(
    '<div class="sh-head"><h2>Lagre dagen som mal</h2><button type="button" class="btn ghost" data-back>Tilbake</button></div>' +
    '<form class="sh-body" id="sd" novalidate>' +
      '<section class="grp"><h3>' + fmtDateLong(date) + '</h3><p class="hint">' + plural(blocks.length, 'bolk', 'bolker') + ' med tidene, sjekklistene og notatene slik de står denne dagen.</p>' +
        '<div class="chips" role="radiogroup">' +
          '<button type="button" class="chip" data-mode="new" aria-pressed="true">Ny mal fra en dato</button>' +
          '<button type="button" class="chip" data-mode="replace" aria-pressed="false">Erstatt «' + esc(cur.name) + '»</button>' +
        '</div>' +
      '</section>' +
      '<section class="grp" id="sd-new"><h3>Ny mal</h3>' +
        '<div class="field"><label for="sd-name">Navn</label><input id="sd-name" type="text" value="' + esc(cur.name + ' fra ' + fmtDateShort(defFrom)) + '" autocomplete="off"></div>' +
        '<div class="field"><label for="sd-from">Gjelder fra</label><input id="sd-from" type="date" value="' + defFrom + '"></div>' +
        '<p class="hint">Dager før denne datoen beholder den gamle rytmen. Står det et senere bytte i planen, gjelder den nye malen fram til dit.</p>' +
      '</section>' +
      '<section class="grp" id="sd-rep" hidden><h3>Erstatt malen</h3>' +
        '<p class="hint">«' + esc(cur.name) + '» får dagens oppsett. Det gjelder alle dager som bruker malen, også tidligere dager uten egne endringer. Vil du beholde tidligere dager som de var, velg «Ny mal fra en dato».</p>' +
      '</section>' +
    '</form>' +
    '<div class="sh-foot"><button type="button" class="btn primary grow" data-save>Lagre mal</button></div>',
    sheet => {
      const q = s => sheet.querySelector(s);
      let mode = 'new';
      q('#sd').addEventListener('submit', e => e.preventDefault());
      sheet.querySelectorAll('[data-mode]').forEach(c => c.addEventListener('click', () => {
        mode = c.dataset.mode;
        sheet.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === c));
        q('#sd-new').hidden = mode !== 'new';
        q('#sd-rep').hidden = mode !== 'replace';
      }));
      q('#sd-from').addEventListener('change', e => {
        const n = q('#sd-name');
        if (/ fra \d+\. \w+$/.test(n.value)) n.value = cur.name + ' fra ' + fmtDateShort(e.target.value);
      });
      q('[data-save]').addEventListener('click', () => {
        if (mode === 'replace') {
          closeSheet();
          mutate('«' + cur.name + '» oppdatert', () => {
            state.templates[curId].blocks = clone(blocks);
            const d = state.days[date];
            if (d) delete d.blocks;
          });
          return;
        }
        const name = q('#sd-name').value.trim(), from = q('#sd-from').value;
        if (!name) { q('#sd-name').focus(); return; }
        if (!from) { q('#sd-from').focus(); return; }
        closeSheet();
        mutate('«' + name + '» gjelder fra ' + fmtDateShort(from), () => { const t = makeTemplate(name, blocks); scheduleFrom(from, t.id); });
      });
    });
}

async function exportData() {
  const name = 'dogn-backup-' + todayISO() + '.json';
  const copy = clone(state);
  copy.meta.lastExport = todayISO();
  const json = JSON.stringify(copy, null, 1);
  const done = msg => { state.meta.lastExport = todayISO(); dayRec(todayISO()).done['gen-backup'] = true; persist(); render(); if (sheetOpen() && reopen) reopen(); toast(msg); };
  let file = null;
  try { file = new File([json], name, { type: 'application/json' }); } catch (e) {}
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); done('Backup eksportert'); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    done('Backup lastet ned');
  } catch (e) { toast('Eksporten virket ikke i denne nettleseren.'); }
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const obj = migrate(JSON.parse(r.result));
      closeSheet();
      mutate('Backup importert', () => { state = obj; });
    } catch (e) { toast(e.message && e.message.includes('Døgn') ? e.message : 'Filen kunne ikke leses som backup.'); }
  };
  r.onerror = () => toast('Filen kunne ikke leses.');
  r.readAsText(file);
}

function partnerStatus(date) {
  if (!partnerOn()) return null;
  const P = state.partner;
  const code = P.shifts[date];
  if (!code) return { code: '', def: null, home: null };
  const def = P.codes[code];
  if (!def) return { code, def: null, home: null };
  const b = blocksFor(date).find(x => x.link === 'dinner');
  const dm = b ? toMin(b.start) : 17 * 60 + 30;
  const c = Number(P.commute) || 0;
  let home = true;
  if (def.kind === 'work' && def.start && def.end) home = (toMin(def.end) + c <= dm) || (toMin(def.start) - c >= dm + 30);
  else if (def.kind === 'night' && def.start) home = toMin(def.start) - c >= dm + 30;
  return { code, def, home };
}

/* Import av turnus: JSON fra Døgn, eller tekstlinjer som «2026-10-01 D» / «01.10.2026 D». */
function parseRota(text) {
  const t = text.trim();
  if (t.startsWith('{')) {
    const o = JSON.parse(t);
    if (!o.shifts || typeof o.shifts !== 'object') throw new Error('Filen mangler vakter.');
    return { codes: o.codes || {}, shifts: o.shifts };
  }
  const shifts = {};
  t.split(/\r?\n/).forEach(line => {
    const m = line.trim().match(/^(\d{4}-\d{2}-\d{2}|\d{1,2}\.\d{1,2}\.\d{4})\s+(\S+)/);
    if (!m) return;
    let d = m[1];
    if (d.includes('.')) { const [dd, mm, yy] = d.split('.'); d = yy + '-' + pad(mm) + '-' + pad(dd); }
    shifts[d] = m[2].toUpperCase();
  });
  if (!Object.keys(shifts).length) throw new Error('Fant ingen linjer med dato og vaktkode.');
  return { codes: {}, shifts };
}
function importRota(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const { codes, shifts } = parseRota(String(r.result));
      let unknown = [];
      mutate('Turnus importert: ' + plural(Object.keys(shifts).length, 'dag', 'dager'), () => {
        const P = state.partner;
        Object.assign(P.codes, codes);
        Object.assign(P.shifts, shifts);
        P.enabled = true;
        unknown = [...new Set(Object.values(shifts))].filter(c => !P.codes[c]);
        unknown.forEach(c => { P.codes[c] = { label: 'Ukjent kode', kind: 'work', start: '', end: '' }; });
      });
      openPartnerSheet();
      if (unknown.length) toast('Legg inn tider for: ' + unknown.join(', '));
    } catch (e) { toast(e.message || 'Filen kunne ikke leses som turnus.'); }
  };
  r.readAsText(file);
}

const SEED_TASK_OFFSETS = { 't-stov-oppe': 0, 't-stov-nede': 2, 't-bad-oppe': 1, 't-bad-nede': 8, 't-bad': 3 };

/* ---------- automatisk backup til GitHub (valgfritt) ---------- */
const PUSH_INTERVAL = 60 * 60 * 1000;
const sync = { cfg: null, timer: null, busy: false };
const syncOn = () => !!(sync.cfg && sync.cfg.token && sync.cfg.owner && sync.cfg.repo);
async function loadSync() {
  let c = null;
  try { c = await store.getKey('sync'); } catch (e) {}
  sync.cfg = c || null;
}
function saveSync() { store.setKey('sync', sync.cfg); }
function ghUrl() {
  const c = sync.cfg;
  return '/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo) + '/contents/' + (c.path || 'dogn-backup.json').split('/').map(encodeURIComponent).join('/');
}
async function gh(method, url, body, accept) {
  const headers = { 'Authorization': 'Bearer ' + sync.cfg.token, 'Accept': accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  if (body) headers['Content-Type'] = 'application/json';
  return fetch('https://api.github.com' + url, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
}
function ghError(r) {
  const m = { 401: 'Nøkkelen er ugyldig eller utløpt.', 403: 'Nøkkelen mangler tilgang til repoet.', 404: 'Fant ikke repoet eller filen. Sjekk eier, navn og at nøkkelen gjelder dette repoet.', 409: 'Konflikt ved lagring. Prøv igjen.', 422: 'GitHub avviste filen.' };
  return new Error(m[r.status] || 'GitHub svarte med feilkode ' + r.status + '.');
}
function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function pushNow() {
  if (!syncOn() || sync.busy) return false;
  sync.busy = true;
  clearTimeout(sync.timer);
  let ok = false;

/* ---------- vær (Open-Meteo, med MET Nordic-modellen i Norden) ---------- */
const WMO = { 0: 'klart', 1: 'lettskyet', 2: 'delvis skyet', 3: 'overskyet', 45: 'tåke', 48: 'tåke', 51: 'lett yr', 53: 'yr', 55: 'tett yr', 56: 'underkjølt yr', 57: 'underkjølt yr',
  61: 'lett regn', 63: 'regn', 65: 'kraftig regn', 66: 'underkjølt regn', 67: 'underkjølt regn', 71: 'lett snø', 73: 'snø', 75: 'kraftig snø', 77: 'snøkorn',
  80: 'lette regnbyger', 81: 'regnbyger', 82: 'kraftige regnbyger', 85: 'snøbyger', 86: 'kraftige snøbyger', 95: 'torden', 96: 'torden og hagl', 99: 'torden og hagl' };
const wx = { data: null, index: null, loading: false };
function wxSetData(d) {
  wx.data = d;
  wx.index = new Map();
  if (d && d.time) d.time.forEach((t, i) => wx.index.set(t, i));
}
async function loadWeatherCache() { try { wxSetData(await store.getKey('weather')); } catch (e) {} }
function wxFresh() {
  const p = state.place, d = wx.data;
  return !!(p && d && d.lat === p.lat && d.lon === p.lon && Date.now() - Date.parse(d.fetched) < 60 * 60 * 1000);
}
async function refreshWeather(force) {
  const p = state && state.place;
  if (!p || wx.loading || (!force && wxFresh())) return;
  wx.loading = true;
  try {
    const nordic = p.lat > 54 && p.lat < 72 && p.lon > 3 && p.lon < 33;
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + p.lat + '&longitude=' + p.lon +
      '&hourly=temperature_2m,precipitation,weather_code,wind_speed_10m&wind_speed_unit=ms&timezone=auto&past_days=1&forecast_days=10' +
      (nordic ? '&models=metno_seamless' : '');
    const r = await fetch(url);
    if (!r.ok) throw new Error('vær ' + r.status);
    const h = (await r.json()).hourly;
    wxSetData({ lat: p.lat, lon: p.lon, fetched: new Date().toISOString(), time: h.time, t: h.temperature_2m, p: h.precipitation, c: h.weather_code, w: h.wind_speed_10m });
    store.setKey('weather', wx.data);
    renderTimeline();
  } catch (e) { /* uten nett: bruk det som ligger lagret */ }
  finally { wx.loading = false; }
}
/* Oppsummerer været for et tidsrom samme dag (minutter fra midnatt). */
function wxFor(date, s, e) {
  const d = wx.data;
  if (!d || !wx.index || !state.place || d.lat !== state.place.lat || d.lon !== state.place.lon) return null;
  const rows = [];
  for (let h = Math.floor(s / 60); h < Math.max(Math.floor(s / 60) + 1, Math.ceil(e / 60)); h++) {
    const i = wx.index.get(date + 'T' + pad(Math.min(23, h)) + ':00');
    if (i != null && d.t[i] != null) rows.push(i);
  }
  if (!rows.length) return null;
  const t = rows.map(i => d.t[i]), p = rows.map(i => d.p[i] || 0), w = rows.map(i => d.w[i] || 0), c = rows.map(i => d.c[i] || 0);
  const sum = p.reduce((a, b) => a + b, 0);
  return { tmin: Math.round(Math.min(...t)), tmax: Math.round(Math.max(...t)), precip: Math.round(sum * 10) / 10, pmax: Math.max(...p), wind: Math.round(Math.max(...w)), code: Math.max(...c) };
}
const isWet = w => !!w && (w.precip >= 1 || w.pmax >= 0.5);
const isWindy = w => !!w && w.wind >= 10;
function wxText(w) {
  const temp = w.tmin === w.tmax ? w.tmin + '°' : w.tmin + '–' + w.tmax + '°';
  const parts = [temp, WMO[w.code] || ''];
  if (w.precip > 0) parts.push(String(w.precip).replace('.', ',') + ' mm');
  parts.push('vind ' + w.wind + ' m/s');
  return parts.filter(Boolean).join(', ');
}

function lastPicked(aid, before) {
  let last = null;
  for (const [d, rec] of Object.entries(state.days)) {
    if (d >= before || !rec.picks) continue;
    if (Object.values(rec.picks).includes(aid) && (!last || d > last)) last = d;
  }
  return last;
}
function actFits(a, date, s, e) {
  if (a.days && a.days.length && !a.days.includes(isoWd(date))) return false;
  const need = Math.min(Number(a.minutes) || 30, 120);
  let from = s, to = e;
  if (a.from) from = Math.max(from, toMin(a.from));
  if (a.to) to = Math.min(to, toMin(a.to));
  return to - from >= Math.min(need, e - s) - 5 && (e - s) + 15 >= Math.min(need, 60);
}
/* Rangerer aktiviteter for en våkenbolk ut fra vær, dagslys, faste tider og hva som er gjort nylig. */
function suggest(date, s, e) {
  const w = wxFor(date, s, e);
  const sun = sunTimes(date);
  const light = sun.rise == null ? e - s : Math.max(0, Math.min(e, sun.set) - Math.max(s, sun.rise));
  const wet = isWet(w), windy = isWindy(w);
  const out = [];
  for (const a of state.activities) {
    if (!actFits(a, date, s, e)) continue;
    let score = 0;
    if (a.kind === 'ute') {
      if (light < 30) continue;
      if (wet && a.weather === 'dry') continue;
      if (w) score += wet ? -2 : 3;
      if (windy) score -= 1.5;
      if (light >= Math.min(90, e - s)) score += 0.5;
    } else if (wet) score += 1.5;
    if (a.days && a.days.length) score += 2.5;
    if (a.travel === 'hjemme' && e - s >= 90) score -= 0.5;
    if (a.travel !== 'hjemme' && e - s < 45) score -= 4;
    if (a.travel === 'bil') score -= 0.6; else if (a.travel === 'kollektiv') score -= 0.3;
    const last = lastPicked(a.id, date);
    score += last ? Math.min(diffDays(last, date), 14) / 7 : 1.5;
    out.push({ a, score });
  }
  out.sort((x, y) => y.score - x.score || x.a.name.localeCompare(y.a.name));
  return { w, light, list: out.map(o => o.a) };
}
/* Tre forslag med bredde: et fast tilbud i dag, noe ute og noe inne når det er mulig. */
function pickTop(list, n) {
  const out = [];
  const add = a => { if (a && !out.includes(a) && out.length < n) out.push(a); };
  add(list.find(a => a.days && a.days.length));
  add(list.find(a => a.kind === 'ute'));
  add(list.find(a => a.kind === 'inne'));
  list.forEach(add);
  return out.sort((x, y) => list.indexOf(x) - list.indexOf(y));
}
function actMeta(a) {

  if (a.days && a.days.length) parts.push(a.days.slice().sort().map(d => WD_SHORT[d - 1].toLowerCase()).join('/') + (a.from ? ' ' + a.from + (a.to ? '–' + a.to : '') : ''));

}

/* ---------- visningsvalg ---------- */
const showOn = k => !(state.settings && state.settings.show && state.settings.show[k] === false);
const DEFAULT_PACK = ['Bleier, fire per barn', 'Våtservietter og stelleunderlag', 'Skift til alle', 'Mat, vann og smekker', 'Regntrekk og ullteppe', 'Ekstra lue og votter'];

/* ---------- nå-kort ---------- */
function lastWake(date) {
  let w = null;
  getLog(date).sleep.forEach(e => { if (e.end && (!w || e.end > w)) w = e.end; });
  if (!w) {
    const N = getLog(addDays(date, -1)).night;
    Object.values(N).forEach(n => { if (n && n.wake && (!w || n.wake > w)) w = n.wake; });
  }
  return w;
}
function nowModel() {
  const date = todayISO();
  if (view !== date || !showOn('nowbar')) return null;
  const blocks = blocksFor(date), now = nowMin();
  if (!blocks.length) return null;
  let cur = -1;
  blocks.forEach((b, i) => { if (toMin(b.start) <= now) cur = i; });
  if (cur >= 0 && now >= endOf(blocks, cur)) return null;
  const b = cur >= 0 ? blocks[cur] : null;
  const next = cur >= 0 ? blocks[cur + 1] : blocks[0];
  const ids = state.kids.map(k => k.id);
  const nb = nightBlock(blocks);
  let act = null;
  const napState = blk => ids.map(k => { const e = napEntry(date, k, blk.id); return !e ? 'none' : (!e.end ? 'open' : 'done'); });
  const who = list => list.length > 1 && list.length === ids.length ? groupWord() : list.map(kidName).join(' og ');
  if (b && b.type === 'sleep') {
    const st = napState(b);
    const open = ids.filter((k, i) => st[i] === 'open'), none = ids.filter((k, i) => st[i] === 'none');
    if (open.length) act = { kind: 'sleep', block: b.id, kids: open, label: who(open) + ' våknet' };
    else if (none.length && !st.includes('done')) act = { kind: 'sleep', block: b.id, kids: none, label: who(none) + ' sovnet' };
  }
  if (!act && b && nb && b.id === nb.id) {
    const N = getLog(date).night;
    const none = ids.filter(k => !(N[k] && N[k].asleep));
    if (none.length) act = { kind: 'night', block: b.id, kids: none, label: who(none) + ' sovnet' };
  }
  if (!act && next && next.type === 'sleep' && toMin(next.start) - now <= 45 && napState(next).every(x => x === 'none')) {
    act = { kind: 'sleep', block: next.id, kids: ids, label: groupWord() + ' sovnet' };
  }
  if (!act && next) act = { kind: 'start', block: next.id, label: (next.title || TYPES[next.type]) + ' starter nå' };
  let line1 = b ? (b.title || TYPES[b.type]) + ', ' + fmtDur(Math.max(1, endOf(blocks, cur) - now)) + ' igjen' : 'Dagen starter ' + blocks[0].start;
  if (b && b.type !== 'sleep') {
    const w = lastWake(date);
    if (w && toMin(w) <= now) line1 += ', våken ' + fmtDurShort(now - toMin(w));
  }
  return { line1, line2: next ? 'neste ' + next.start + ' ' + (next.title || TYPES[next.type]) : 'siste bolk i dag', act };
}
function renderNowbar() {
  const el = $('#nowbar');
  if (!el || !state) return;
  const m = nowModel();
  if (!m) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = '<button type="button" class="nb-txt" data-nb="scroll"><span class="nb-1">' + esc(m.line1) + '</span><span class="nb-2">' + esc(m.line2) + '</span></button>' +
    (m.act ? '<button type="button" class="btn small primary nb-act" data-nb="act">' + esc(m.act.label) + '</button>' : '');
  el._act = m.act;
}
function nowbarAction(act) {
  if (!act) return;
  if (act.kind === 'sleep') mutate('', () => logSleepNow(view, act.block, act.kids));
  else if (act.kind === 'night') mutate('', () => logNightNow(view, act.block, act.kids));
  else if (act.kind === 'start') {
    const b = blocksFor(view).find(x => x.id === act.block);
    if (!b) return;
    const delta = nowMin() - toMin(b.start);
    if (!delta) { toast(b.title + ' starter allerede nå'); return; }
    mutate((b.title || 'Bolken') + ' starter nå, resten av dagen flyttet ' + (delta > 0 ? '+' : '−') + fmtDur(Math.abs(delta)), () => shiftFrom(b.id, delta));
  }
  scrollToNow();
}

/* ---------- klær og pakkeliste ---------- */
function clothesFor(w, pram) {
  if (!w) return '';
  const t = w.tmin;
  let base;
  if (t >= 16) base = 'lett tøy og solhatt';
  else if (t >= 10) base = 'ull eller bomull innerst, fleece og tynn lue';
  else if (t >= 5) base = 'ull innerst, fleece, vindtett dress og lue';
  else if (t >= 0) base = 'ull innerst, ullgenser, vinterdress, lue, votter og ullsokker';
  else base = 'to lag ull, vinterdress, varm lue, votter og vognpose';
  const extra = [];
  if (isWet(w)) extra.push(t < 1 ? 'vanntette votter og støvler' : 'regndress og støvler');
  if (isWet(w) && pram) extra.push('regntrekk på vogna');
  if (w.wind >= 8 && t < 10) extra.push('vindtett ytterlag');
  return base + (extra.length ? ', ' + extra.join(', ') : '');
}
function packRows(date, blocks) {
  const map = {};
  const d = state.days[date];
  if (!d || !d.picks || !showOn('gear')) return map;
  const list = (state.settings.packList && state.settings.packList.length) ? state.settings.packList : DEFAULT_PACK;
  blocks.forEach(b => {
    const a = d.picks[b.id] && state.activities.find(x => x.id === d.picks[b.id]);
    if (!a || a.travel === 'hjemme') return;
    map[b.id] = list.map((txt, i) => ({ id: 'gen-pack-' + b.id + '-' + i, text: txt, sub: i === 0 ? 'Pakkeliste for ' + a.name : '', gen: true }));
  });
  return map;
}

/* ---------- i morgen ---------- */
function tomorrowHTML(date) {
  const t = addDays(date, 1);

  if (w) kv('vær', wxText(w) + (sun.rise != null ? ', lyst ' + toHM(sun.rise) + '–' + toHM(sun.set) : ''));
  else if (sun.rise != null) kv('lyst', toHM(sun.rise) + '–' + toHM(sun.set));
  if (w && showOn('gear')) kv('klær', clothesFor(w, true));
  const ps = partnerStatus(t);

  (state.appts || []).filter(a => a.date === t).forEach(a => kv('avtale', a.start + ' ' + a.title + (a.where ? ', ' + a.where : '')));
  const tasks = Object.values(placeTasks(t, tb)).flat().filter(x => !x.st.done).map(x => x.task.text);
  if (tasks.length) kv('gjøremål', tasks.slice(0, 6).join(', ') + (tasks.length > 6 ? ' med flere' : ''));
  return '<div class="tomorrow"><span class="tm-h">i morgen, ' + fmtDateTiny(t) + '</span><dl>' + rows.join('') + '</dl></div>';

/* ---------- dagsrapport ---------- */
function dayReport(date) {
  const L = getLog(date), blocks = blocksFor(date);
  const out = ['Døgn, ' + fmtDateLong(date).toLowerCase()];
  state.kids.forEach(k => {
    const naps = L.sleep.filter(e => e.kid === k.id && e.start).sort((a, b) => a.start.localeCompare(b.start));
    const n = L.night[k.id] || {};
    const parts = naps.map(e => e.end ? e.start + '–' + e.end + ' (' + fmtDurShort(toMin(e.end) - toMin(e.start)) + ')' : 'fra ' + e.start + ', sover fortsatt');
    out.push(k.name + ': ' + (parts.length ? 'lur ' + parts.join(', ') : 'ingen lur logget') + (n.asleep ? '. Sovnet ' + n.asleep : '') + '.');
  });
  const meals = blocks.filter(b => L.meals[b.id]).map(b => b.title + ' ' + state.kids.map(k => k.name.charAt(0) + ' ' + (L.meals[b.id][k.id] || '–')).join(', '));
  if (meals.length) out.push('Mat: ' + meals.join('; ') + '.');
  const d = state.days[date];
  const did = d && d.picks ? Object.values(d.picks).map(id => (state.activities.find(a => a.id === id) || {}).name).filter(Boolean) : [];
  if (did.length) out.push('Gjorde: ' + did.join(', ') + '.');
  const din = dishFor(date, 'dinner');
  if (din) out.push('Middag: ' + din.name + '.');
  const ap = (state.appts || []).filter(a => a.date === date);
  if (ap.length) out.push('Avtaler: ' + ap.map(a => a.start + ' ' + a.title).join(', ') + '.');
  if (L.note) out.push('Notat: ' + L.note);
  return out.join('\n');
}
async function shareReport(date) {
  const text = dayReport(date);
  try { if (navigator.share) { await navigator.share({ title: 'Døgn ' + fmtDateTiny(date), text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Dagsrapporten er kopiert'); } catch (e) { openSheet(headHTML('Dagsrapport') + '<div class="sh-body"><section class="grp"><p class="hint">Kopier teksten:</p><textarea rows="10" readonly>' + esc(text) + '</textarea></section></div>'); }
}

/* ---------- legg til (husk, avtale, rubrikk) ---------- */
function reminderTarget(when) {
  const today = todayISO(), now = nowMin();
  if (when === 'kveld') { const bl = blocksFor(today); const k = bl.find(b => b.slot === 'kveld') || bl[bl.length - 1]; return { date: today, slot: k ? k.slot : 'kveld', type: k ? k.type : 'routine', label: 'i kveld' }; }
  const bl = blocksFor(today);
  if (when === 'lur') {
    const i = bl.findIndex((b, j) => b.type === 'sleep' && endOf(bl, j) > now);
    if (i >= 0) return { date: today, slot: bl[i].slot, type: 'sleep', label: 'i luren kl. ' + bl[i].start };
  }
  const t = addDays(today, 1);
  const tb = blocksFor(t).find(b => b.type === 'sleep') || blocksFor(t)[0];
  return { date: t, slot: tb ? tb.slot : 'lur1', type: tb ? tb.type : 'sleep', label: 'i morgen' + (tb ? ' kl. ' + tb.start : '') };
}

  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  const blk = el.closest('.blk');
  if (a === 'expand') { expanded.add(blk.dataset.id); renderTimeline(); }
  else if (a === 'time') { shiftOpen = shiftOpen === blk.dataset.id ? null : blk.dataset.id; renderTimeline(); }
  else if (a === 'edit') openBlockSheet(blk.dataset.id);
  else if (a === 'new') openBlockSheet(null);
  else if (a === 'export') exportData();
  else if (a === 'log') openLogSheet(view);
  else if (a === 'appt') openApptSheet(el.dataset.appt);
  else if (a === 'week') openWeekSheet();
  else if (a === 'acts') openActivitiesSheet();
  else if (a === 'report') shareReport(view);
  else if (a === 'dish') openSwapSheet(view, el.dataset.meal, null);
  else if (a === 'wife') {
    const ph = partnerHome(view);
    const d = dayRec(view);
    const next = !ph.home;
    if (ph.ps && ph.ps.home === next) delete d.wife; else d.wife = next;
    persist(); renderTimeline();
  }
  else if (a === 'pick') { const d = dayRec(view); (d.picks ??= {})[blk.dataset.id] = el.dataset.aid; persist(); renderTimeline(); }
  else if (a === 'unpick') { const d = dayRec(view); if (d.picks) delete d.picks[blk.dataset.id]; persist(); renderTimeline(); }
  else if (a === 'more') openSuggestSheet(view, blk.dataset.id);
  else if (a === 'sync') pushNow().then(ok => toast(ok ? 'Lagret i GitHub' : 'Lagring feilet'));
  else if (a === 'rate') cycleRate(view, blk.dataset.id, el.dataset.kid);
  else if (a === 'sleep-now') {
    const kids = el.dataset.kid === 'all' ? state.kids.map(k => k.id) : [el.dataset.kid];
    mutate('', () => logSleepNow(view, blk.dataset.id, kids));
  }
  else if (a === 'night-now') {
    const kids = el.dataset.kid === 'all' ? state.kids.map(k => k.id) : [el.dataset.kid];
    mutate('', () => logNightNow(view, blk.dataset.id, kids));
  }
  else if (a === 'sleep-edit') openNapSheet(view, blk.dataset.id, el.dataset.kid, null);
});
$('#timeline').addEventListener('change', e => {
  const cb = e.target.closest('input[data-done]');
  if (cb) toggleDone(view, cb.dataset.done, cb.checked);
});
/* sveip til sidene for å bytte dag */
(() => {
  let sx = 0, sy = 0, st = 0;
  const tl = $('#timeline');
  tl.addEventListener('touchstart', e => { const p = e.touches[0]; sx = p.clientX; sy = p.clientY; st = Date.now(); }, { passive: true });
  tl.addEventListener('touchend', e => {
    const p = e.changedTouches[0], dx = p.clientX - sx, dy = p.clientY - sy;
    if (Date.now() - st < 600 && Math.abs(dx) > 70 && Math.abs(dy) < 45) go(dx < 0 ? 1 : -1);
  }, { passive: true });
})();

function tick() {
  if (!state) return;
  refreshWeather();
  const t = todayISO();
  if (t !== lastToday) {
    if (view === lastToday) { view = t; expanded.clear(); }
    lastToday = t;
    render(); scrollToNow();
  } else if (view === t) render();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); else { tick(); if (syncOn() && sync.cfg.dirty && Date.now() - Date.parse(sync.cfg.lastPush || 0) > PUSH_INTERVAL) pushNow(); } });
window.addEventListener('pagehide', flush);
window.addEventListener('resize', renderHeader);

/* ---------- oppstart ---------- */
(async () => {
  await store.init();
  await loadSync();
  await loadWeatherCache();
  let saved = null;
  try { saved = await store.get(); } catch (e) {}
  try { state = saved ? migrate(saved) : seed(); } catch (e) { state = seed(); }
  persist();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}
  render();
  scrollToNow();
  if (!state.meta.setupDone) setTimeout(() => openProfileSheet(true), 300);
  if (syncOn() && sync.cfg.dirty) setTimeout(pushNow, 3000);
  refreshWeather();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderHeader);
  setInterval(tick, 30000);
  try {
    if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window.self) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  } catch (e) {}
})();
</script>
</body>
