<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Døgn</title>
<!-- Oppdateres fra --bar i tokens.css når appen starter -->
<meta name="theme-color" content="#1B2127">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Døgn">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles/tokens.css">

<!-- Skriptene deler samme globale navnerom og kjøres i denne rekkefølgen etter at siden er lest inn.
     Nye filer legges også inn i APP_FILES i js/version.js. -->
<script src="js/version.js" defer></script>
<script src="js/text.nb.js" defer></script>
<script src="js/util.js" defer></script>
<script src="js/seed.js" defer></script>
<script src="js/migrate.js" defer></script>
<script src="js/store.js" defer></script>
<script src="js/domain/plan.js" defer></script>
<script src="js/domain/tasks.js" defer></script>
<script src="js/domain/menu.js" defer></script>

<script src="js/domain/weather.js" defer></script>
<script src="js/domain/activities.js" defer></script>
<script src="js/domain/partner.js" defer></script>
<script src="js/domain/sync.js" defer></script>
<script src="js/domain/takt.js" defer></script>
<script src="js/views/sheet.js" defer></script>
<script src="js/views/timeline.js" defer></script>
<script src="js/views/plan.js" defer></script>
<script src="js/views/food.js" defer></script>

<script src="js/views/setup.js" defer></script>

<body>
<header class="top" id="top">
  <div class="wrap">
    <h1 class="date"><button type="button" class="date-btn" id="date">Døgn</button></h1>
    <div class="nav">
      <button class="icon-btn" id="prev" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="icon-btn" id="next" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <div class="sub" id="sub"></div>
    <div class="strip-wrap" id="strip"></div>
    <div class="nowbar" id="nowbar" hidden></div>
  </div>
</header>
<main class="wrap" id="timeline" aria-live="off"></main>
<nav class="bottombar" id="bottombar">
  <div class="bb-in">
    <button type="button" id="tab-today">i dag</button>
    <button type="button" id="tab-week">mat</button>
    <button type="button" class="bb-add" id="fab">+</button>
    <button type="button" id="tab-log">logg</button>
    <button type="button" id="menu">mer</button>
  </div>
</nav>
<div id="sheet-root" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
